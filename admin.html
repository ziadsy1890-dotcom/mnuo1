<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم - فستق حلب</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px #0001;
}

h1,h2,h3{
    margin-top:0;
}

input,
textarea,
button{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    background:#222;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:active{
    opacity:.8;
}

.logout{
    background:#b00020;
}

#adminPanel{
    display:none;
}

.product{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin:12px 0;
    background:#fafafa;
}

.product.hidden{
    opacity:.65;
    background:#eee;
}

.product img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

.actions button{
    flex:1;
    min-width:120px;
}

.edit{
    background:#0069d9;
}

.hide{
    background:#777;
}

.show{
    background:#198754;
}

.delete{
    background:#c62828;
}

.message{
    text-align:center;
    font-weight:bold;
    min-height:20px;
}

.success{
    color:green;
}

.error{
    color:#c62828;
}

.small{
    color:#666;
    font-size:14px;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

.options{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin:10px 0;
    background:#fafafa;
}

.options label{
    display:block;
    padding:8px 0;
    font-size:16px;
}

.options input[type="checkbox"]{
    width:auto;
    margin-left:8px;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    margin:5px 0;
}

.status-visible{
    background:#d1e7dd;
    color:#0f5132;
}

.status-hidden{
    background:#f8d7da;
    color:#842029;
}

.info{
    background:#e7f1ff;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<!-- تسجيل الدخول -->
<div id="loginPanel" class="card">

    <h1>🔐 لوحة تحكم فستق حلب</h1>

    <p>تسجيل دخول الإدارة</p>

    <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email">

    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password">

    <button onclick="login()">
        تسجيل الدخول
    </button>

    <p id="loginMessage" class="message"></p>

</div>


<!-- لوحة الإدارة -->
<div id="adminPanel">

    <div class="card">

        <h1>🍰 فستق حلب</h1>

        <p class="small">
            لوحة إدارة الأصناف والأسعار
        </p>

        <button class="logout" onclick="logout()">
            تسجيل الخروج
        </button>

    </div>


    <!-- إضافة صنف -->
    <div class="card">

        <h2>➕ إضافة صنف جديد</h2>

        <div class="info">
            السعر الذي تدخله هنا هو سعر الكيلو.
            يمكنك اختيار ربع كيلو ونصف كيلو وكيلو.
        </div>

        <input
            type="text"
            id="productName"
            placeholder="اسم الصنف">

        <input
            type="number"
            id="productPrice"
            placeholder="سعر الكيلو"
            min="0"
            step="0.01">

        <input
            type="text"
            id="productCategory"
            placeholder="التصنيف">

        <input
            type="number"
            id="maxQuantity"
            placeholder="الحد الأقصى للكمية"
            min="1"
            value="10">

        <textarea
            id="productDescription"
            placeholder="وصف الصنف"></textarea>

        <input
            type="url"
            id="productImage"
            placeholder="رابط صورة الصنف">

        <div class="options">

            <strong>الأوزان المتاحة:</strong>

            <label>
                <input
                    type="checkbox"
                    id="weightQuarter"
                    value="ربع كيلو"
                    checked>
                ربع كيلو
            </label>

            <label>
                <input
                    type="checkbox"
                    id="weightHalf"
                    value="نصف كيلو"
                    checked>
                نصف كيلو
            </label>

            <label>
                <input
                    type="checkbox"
                    id="weightKilo"
                    value="كيلو"
                    checked>
                كيلو
            </label>

        </div>

        <button onclick="addProduct()">
            ➕ إضافة الصنف
        </button>

        <p id="addMessage" class="message"></p>

    </div>


    <!-- قائمة الأصناف -->
    <div class="card">

        <h2>📋 الأصناف</h2>

        <div id="productsList">
            <div class="empty">
                جاري تحميل الأصناف...
            </div>
        </div>

    </div>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* Firebase */

const firebaseConfig = {
    apiKey: "AIzaSyBoQHatPvFXnmCuI1M1UJcUWWQsB7vk3g0",
    authDomain: "pistach-d-alep.firebaseapp.com",
    projectId: "pistach-d-alep",
    storageBucket: "pistach-d-alep.firebasestorage.app",
    messagingSenderId: "288943885593",
    appId: "1:288943885593:web:4737041244be376c274988",
    measurementId: "G-569W2MXBTJ"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* عناصر الصفحة */

const loginPanel =
    document.getElementById("loginPanel");

const adminPanel =
    document.getElementById("adminPanel");

const loginMessage =
    document.getElementById("loginMessage");

const addMessage =
    document.getElementById("addMessage");

const productsList =
    document.getElementById("productsList");


/* تسجيل الدخول */

window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginMessage.textContent = "";

    if(!email || !password){

        loginMessage.textContent =
            "أدخل البريد الإلكتروني وكلمة المرور";

        loginMessage.className =
            "message error";

        return;
    }

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        loginMessage.textContent =
            "تم تسجيل الدخول";

        loginMessage.className =
            "message success";

    }catch(error){

        console.error(error);

        loginMessage.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة";

        loginMessage.className =
            "message error";
    }

};


/* تسجيل الخروج */

window.logout = async function(){

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

};


/* مراقبة حالة تسجيل الدخول */

onAuthStateChanged(auth, async(user)=>{

    if(user){

        loginPanel.style.display = "none";

        adminPanel.style.display = "block";

        await loadProducts();

    }else{

        loginPanel.style.display = "block";

        adminPanel.style.display = "none";

    }

});


/* الأوزان المختارة */

function getSelectedWeights(){

    const weights = [];

    if(
        document.getElementById("weightQuarter").checked
    ){
        weights.push("ربع كيلو");
    }

    if(
        document.getElementById("weightHalf").checked
    ){
        weights.push("نصف كيلو");
    }

    if(
        document.getElementById("weightKilo").checked
    ){
        weights.push("كيلو");
    }

    return weights;
}


/* إضافة صنف */

window.addProduct = async function(){

    const name =
        document.getElementById("productName").value.trim();

    const price =
        Number(
            document.getElementById("productPrice").value
        );

    const category =
        document.getElementById("productCategory").value.trim();

    const maxQuantity =
        Number(
            document.getElementById("maxQuantity").value
        );

    const description =
        document.getElementById("productDescription").value.trim();

    const image =
        document.getElementById("productImage").value.trim();

    const weights =
        getSelectedWeights();


    if(!name){

        addMessage.textContent =
            "اكتب اسم الصنف";

        addMessage.className =
            "message error";

        return;
    }


    if(!price || price < 0){

        addMessage.textContent =
            "أدخل سعرًا صحيحًا";

        addMessage.className =
            "message error";

        return;
    }


    if(!maxQuantity || maxQuantity < 1){

        addMessage.textContent =
            "أدخل الحد الأقصى للكمية";

        addMessage.className =
            "message error";

        return;
    }


    if(weights.length === 0){

        addMessage.textContent =
            "اختر وزنًا واحدًا على الأقل";

        addMessage.className =
            "message error";

        return;
    }


    try{

        await addDoc(
            collection(db,"products"),
            {
                name:name,
                price:price,
                category:category,
                description:description,
                image:image,
                maxQuantity:maxQuantity,
                weights:weights,
                hidden:false,
                createdAt:Date.now()
            }
        );


        addMessage.textContent =
            "✅ تم إضافة الصنف بنجاح";

        addMessage.className =
            "message success";


        document.getElementById("productName").value = "";

        document.getElementById("productPrice").value = "";

        document.getElementById("productCategory").value = "";

        document.getElementById("maxQuantity").value = "10";

        document.getElementById("productDescription").value = "";

        document.getElementById("productImage").value = "";


        document.getElementById("weightQuarter").checked = true;

        document.getElementById("weightHalf").checked = true;

        document.getElementById("weightKilo").checked = true;


        await loadProducts();


    }catch(error){

        console.error(error);

        addMessage.textContent =
            "❌ حدث خطأ أثناء إضافة الصنف";

        addMessage.className =
            "message error";

    }

};


/* تحميل الأصناف */

async function loadProducts(){

    productsList.innerHTML =
        '<div class="empty">جاري تحميل الأصناف...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );


        if(snapshot.empty){

            productsList.innerHTML =
                '<div class="empty">لا توجد أصناف حتى الآن</div>';

            return;
        }


        productsList.innerHTML = "";


        snapshot.forEach((item)=>{

            const data = item.data();

            const hidden =
                data.hidden === true;

            const maxQuantity =
                data.maxQuantity || 10;

            const weights =
                Array.isArray(data.weights)
                ? data.weights
                : ["كيلو"];


            const product =
                document.createElement("div");

            product.className =
                hidden
                ? "product hidden"
                : "product";


            const image =
                data.image
                ? `
                    <img
                        src="${escapeHtml(data.image)}"
                        alt="${escapeHtml(data.name || "")}"
                        onerror="this.style.display='none'">
                  `
                : "";


            const status =
                hidden
                ? `
                    <span class="status status-hidden">
                        🔴 مخفي عن العملاء
                    </span>
                  `
                : `
                    <span class="status status-visible">
                        🟢 ظاهر للعملاء
                    </span>
                  `;


            const hideButton =
                hidden
                ? `
                    <button
                        class="show"
                        onclick="toggleHidden('${item.id}', true)">
                        👁️ إظهار
                    </button>
                  `
                : `
                    <button
                        class="hide"
                        onclick="toggleHidden('${item.id}', false)">
                        🚫 إخفاء
                    </button>
                  `;


            product.innerHTML = `

                ${image}

                <h3>
                    ${escapeHtml(data.name || "بدون اسم")}
                </h3>

                <p>
                    💰 السعر: ${Number(data.price || 0)} جنيه / كيلو
                </p>

                <p>
                    📦 الحد الأقصى:
                    ${maxQuantity}
                </p>

                <p>
                    ⚖️ الأوزان:
                    ${weights.join(" - ")}
                </p>

                <p>
                    🏷️ التصنيف:
                    ${escapeHtml(data.category || "بدون تصنيف")}
                </p>

                ${
                    data.description
                    ? `
                        <p>
                            📝 ${escapeHtml(data.description)}
                        </p>
                      `
                    : ""
                }

                ${status}

                <div class="actions">

                    <button
                        class="edit"
                        onclick="editProduct('${item.id}')">
                        ✏️ تعديل
                    </button>

                    ${hideButton}

                    <button
                        class="delete"
                        onclick="deleteProduct('${item.id}')">
                        🗑️ حذف
                    </button>

                </div>
            `;


            productsList.appendChild(product);

        });


    }catch(error){

        console.error(error);

        productsList.innerHTML =
            `
            <div class="empty error">
                ❌ لم نتمكن من تحميل الأصناف
            </div>
            `;

    }

}


/* إخفاء / إظهار */

window.toggleHidden = async function(
    id,
    currentHidden
){

    try{

        await updateDoc(
            doc(db,"products",id),
            {
                hidden:!currentHidden
            }
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            "حدث خطأ أثناء تغيير حالة الصنف"
        );

    }

};


/* تعديل صنف */

window.editProduct = async function(id){

    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );


        let productData = null;


        snapshot.forEach((item)=>{

            if(item.id === id){

                productData = item.data();

            }

        });


        if(!productData){

            alert("الصنف غير موجود");

            return;
        }


        const newName =
            prompt(
                "اسم الصنف:",
                productData.name || ""
            );


        if(newName === null) return;


        const newPrice =
            prompt(
                "سعر الكيلو:",
                productData.price || ""
            );


        if(newPrice === null) return;


        const newMax =
            prompt(
                "الحد الأقصى للكمية:",
                productData.maxQuantity || 10
            );


        if(newMax === null) return;


        const newCategory =
            prompt(
                "التصنيف:",
                productData.category || ""
            );


        if(newCategory === null) return;


        const newDescription =
            prompt(
                "الوصف:",
                productData.description || ""
            );


        if(newDescription === null) return;


        const newImage =
            prompt(
                "رابط الصورة:",
                productData.image || ""
            );


        if(newImage === null) return;


        const oldWeights =
            Array.isArray(productData.weights)
            ? productData.weights
            : ["كيلو"];


        const newWeightsText =
            prompt(
                "الأوزان المتاحة، افصل بينها بفاصلة:\nربع كيلو, نصف كيلو, كيلو",
                oldWeights.join(", ")
            );


        if(newWeightsText === null) return;


        const newWeights =
            newWeightsText
            .split(",")
            .map(item=>item.trim())
            .filter(item=>item);


        if(newWeights.length === 0){

            alert(
                "يجب اختيار وزن واحد على الأقل"
            );

            return;
        }


        const priceNumber =
            Number(newPrice);

        const maxNumber =
            Number(newMax);


        if(
            isNaN(priceNumber) ||
            priceNumber < 0
        ){

            alert("السعر غير صحيح");

            return;
        }


        if(
            isNaN(maxNumber) ||
            maxNumber < 1
        ){

            alert(
                "الحد الأقصى غير صحيح"
            );

            return;
        }


        await updateDoc(
            doc(db,"products",id),
            {
                name:newName.trim(),
                price:priceNumber,
                maxQuantity:maxNumber,
                category:newCategory.trim(),
                description:newDescription.trim(),
                image:newImage.trim(),
                weights:newWeights
            }
        );


        alert("✅ تم تعديل الصنف");

        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            "حدث خطأ أثناء تعديل الصنف"
        );

    }

};


/* حذف صنف */

window.deleteProduct = async function(id){

    const confirmDelete =
        confirm(
            "هل أنت متأكد من حذف هذا الصنف؟"
        );


    if(!confirmDelete){

        return;
    }


    try{

        await deleteDoc(
            doc(db,"products",id)
        );


        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            "حدث خطأ أثناء حذف الصنف"
        );

    }

};


/* حماية النصوص */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
    </html>
