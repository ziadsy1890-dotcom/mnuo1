<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم – فستق حلب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="p-3 md:p-6 text-gray-800">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="max-w-md mx-auto mt-16 bg-white p-6 rounded-2xl shadow-xl border border-gray-100">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-emerald-600 text-white rounded-full flex items-center justify-center text-2xl mx-auto mb-2">🔐</div>
      <h2 class="text-xl font-bold">تسجيل دخول المدير</h2>
    </div>
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold mb-1">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-1 focus:ring-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-bold mb-1">كلمة المرور</label>
        <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-xl text-sm outline-none focus:ring-1 focus:ring-emerald-500">
      </div>
      <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow-md hover:bg-emerald-700 transition text-sm">تسجيل الدخول</button>
    </form>
  </div>

  <!-- لوحة الإدارة الرئيسية -->
  <div id="adminPanel" class="max-w-4xl mx-auto hidden space-y-6">
    <!-- الشريط العلوي -->
    <div class="bg-white p-4 rounded-2xl shadow-xs flex justify-between items-center border border-gray-100">
      <div>
        <h1 class="font-extrabold text-lg">لوحة تحكم المتجر</h1>
        <p class="text-xs text-gray-400">إدارة المنتجات، الإعلانات، والواتساب</p>
      </div>
      <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-100">تسجيل الخروج</button>
    </div>

    <!-- إعدادات الواتساب والتوصيل -->
    <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 space-y-3">
      <h3 class="font-bold text-sm text-gray-700 flex items-center gap-2">
        <i class="fa-solid fa-gear text-emerald-600"></i> إعدادات المتجر العامة
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold mb-1">رقم الواتساب (مع رمز الدولة)</label>
          <input type="text" id="cfgWhatsapp" placeholder="201000000000" class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">رسوم التوصيل (ج.م)</label>
          <input type="number" id="cfgDelivery" placeholder="50" class="w-full px-3 py-2 border rounded-xl text-sm">
        </div>
      </div>
      <button onclick="saveSettings()" class="bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-xl">حفظ الإعدادات</button>
    </div>

    <!-- إضافة/تعديل منتج -->
    <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 space-y-4">
      <h3 class="font-bold text-sm text-gray-700 flex items-center gap-2">
        <i class="fa-solid fa-plus text-emerald-600"></i> إضافة / تعديل منتج
      </h3>
      <form onsubmit="saveProduct(event)" class="space-y-3">
        <input type="hidden" id="prodId">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <input type="text" id="prodName" placeholder="اسم المنتج" required class="px-3 py-2 border rounded-xl text-sm">
          <input type="text" id="prodCategory" placeholder="القسم (مثال: مكسرات)" required class="px-3 py-2 border rounded-xl text-sm">
        </div>
        <textarea id="prodDesc" placeholder="وصف قصير للمنتج..." class="w-full px-3 py-2 border rounded-xl text-sm h-16 resize-none"></textarea>
        <input type="url" id="prodImage" placeholder="رابط صورة المنتج (URL)" required class="w-full px-3 py-2 border rounded-xl text-sm">

        <!-- نوع البيع -->
        <div class="flex gap-4 text-xs font-bold">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="saleType" value="by_weight" checked onclick="togglePricingInputs('weight')"> بيع بالوزن (كيلو)
          </label>
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="radio" name="saleType" value="by_unit" onclick="togglePricingInputs('unit')"> بيع بالقطعة / العلبة
          </label>
        </div>

        <!-- أسعار الوزن -->
        <div id="weightPricing" class="grid grid-cols-3 gap-2 bg-gray-50 p-3 rounded-xl border border-gray-100">
          <div>
            <label class="block text-[11px] font-bold">سعر الكيلو</label>
            <input type="number" id="priceKg" class="w-full px-2 py-1.5 border rounded-lg text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-bold">نصف كيلو (اختياري)</label>
            <input type="number" id="priceHalf" placeholder="تلقائي" class="w-full px-2 py-1.5 border rounded-lg text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-bold">ربع كيلو (اختياري)</label>
            <input type="number" id="priceQuarter" placeholder="تلقائي" class="w-full px-2 py-1.5 border rounded-lg text-xs">
          </div>
        </div>

        <!-- سعر الوحدة المستقلة -->
        <div id="unitPricing" class="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded-xl border border-gray-100 hidden">
          <div>
            <label class="block text-[11px] font-bold">مسمى الوحدة</label>
            <input type="text" id="unitLabel" placeholder="علبة / قطعة" class="w-full px-2 py-1.5 border rounded-lg text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-bold">السعر</label>
            <input type="number" id="unitPrice" class="w-full px-2 py-1.5 border rounded-lg text-xs">
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs">حفظ المنتج</button>
      </form>
    </div>

    <!-- قائمة المنتجات -->
    <div class="bg-white p-4 rounded-2xl shadow-xs border border-gray-100 space-y-3">
      <h3 class="font-bold text-sm text-gray-700">قائمة المنتجات الحالية</h3>
      <div id="adminProductsList" class="space-y-2">
        <!-- قائمة المنتجات -->
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "pistach-d-alep.firebaseapp.com",
      projectId: "pistach-d-alep",
      storageBucket: "pistach-d-alep.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      document.getElementById('loginScreen').classList.toggle('hidden', !!user);
      document.getElementById('adminPanel').classList.toggle('hidden', !user);
      if (user) {
        loadSettings();
        loadAdminProducts();
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPassword').value
        );
      } catch (err) { alert("خطأ في تسجيل الدخول: " + err.message); }
    }

    function handleLogout() { auth.signOut(); }

    async function loadSettings() {
      const doc = await db.collection('settings').doc('store_config').get();
      if (doc.exists) {
        const data = doc.data();
        document.getElementById('cfgWhatsapp').value = data.whatsappNumber || '';
        document.getElementById('cfgDelivery').value = data.deliveryFee || 0;
      }
    }

    async function saveSettings() {
      await db.collection('settings').doc('store_config').set({
        whatsappNumber: document.getElementById('cfgWhatsapp').value.trim(),
        deliveryFee: parseFloat(document.getElementById('cfgDelivery').value) || 0
      }, { merge: true });
      alert("تم حفظ الإعدادات!");
    }

    function togglePricingInputs(type) {
      document.getElementById('weightPricing').classList.toggle('hidden', type !== 'weight');
      document.getElementById('unitPricing').classList.toggle('hidden', type !== 'unit');
    }

    async function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value;
      const saleType = document.querySelector('input[name="saleType"]:checked').value;

      const pData = {
        name: document.getElementById('prodName').value.trim(),
        category: document.getElementById('prodCategory').value.trim(),
        description: document.getElementById('prodDesc').value.trim(),
        imageUrl: document.getElementById('prodImage').value.trim(),
        saleType,
        isHidden: false,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      if (saleType === 'by_weight') {
        pData.priceKg = parseFloat(document.getElementById('priceKg').value) || 0;
        pData.customPrices = {
          halfKg: parseFloat(document.getElementById('priceHalf').value) || null,
          quarterKg: parseFloat(document.getElementById('priceQuarter').value) || null
        };
      } else {
        pData.unitLabel = document.getElementById('unitLabel').value.trim() || 'قطعة';
        pData.unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
      }

      if (id) {
        await db.collection('products').doc(id).update(pData);
      } else {
        await db.collection('products').add(pData);
      }

      alert("تم حفظ المنتج بنجاح!");
      location.reload();
    }

    async function loadAdminProducts() {
      const snap = await db.collection('products').get();
      const list = document.getElementById('adminProductsList');
      list.innerHTML = '';
      snap.forEach(doc => {
        const p = doc.data();
        list.innerHTML += `
          <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-200 text-xs">
            <div class="flex items-center gap-2">
              <img src="${p.imageUrl}" class="w-10 h-10 object-cover rounded-lg">
              <div>
                <h4 class="font-bold">${p.name} (${p.category})</h4>
                <p class="text-gray-500">${p.saleType === 'by_weight' ? `الكيلو: ${p.priceKg} ج.م` : `السعر: ${p.unitPrice} ج.م`}</p>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="toggleHide('${doc.id}', ${!p.isHidden})" class="px-2 py-1 rounded border font-bold">${p.isHidden ? 'إظهار' : 'إخفاء'}</button>
              <button onclick="deleteProd('${doc.id}')" class="text-red-600 font-bold px-2 py-1">حذف</button>
            </div>
          </div>
        `;
      });
    }

    async function toggleHide(id, isHidden) {
      await db.collection('products').doc(id).update({ isHidden });
      loadAdminProducts();
    }

    async function deleteProd(id) {
      if (confirm('هل أنت تأكد من حذف المنتج؟')) {
        await db.collection('products').doc(id).delete();
        loadAdminProducts();
      }
    }
  </script>
</body>
</html>
