<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم - فستق حلب</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px #0001;
}

h1,h2,h3{
    margin-top:0;
}

input,
textarea,
button{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    background:#222;
    color:#fff;
    border:none;
    cursor:pointer;
}

button:active{
    opacity:.8;
}

.logout{
    background:#b00020;
}

#adminPanel{
    display:none;
}

.product{
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    margin:12px 0;
    background:#fafafa;
}

.product.hidden{
    opacity:.65;
    background:#eee;
}

.product img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    display:block;
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
}

.actions button{
    flex:1;
    min-width:120px;
}

.edit{
    background:#0069d9;
}

.hide{
    background:#777;
}

.show{
    background:#198754;
}

.delete{
    background:#c62828;
}

.message{
    text-align:center;
    font-weight:bold;
    min-height:20px;
}

.success{
    color:green;
}

.error{
    color:#c62828;
}

.small{
    color:#666;
    font-size:14px;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

.options{
    border:1px solid #ddd;
    border-radius:10px;
    padding:12px;
    margin:10px 0;
    background:#fafafa;
}

.options label{
    display:block;
    padding:8px 0;
    font-size:16px;
}

.options input[type="checkbox"]{
    width:auto;
    margin-left:8px;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    margin:5px 0;
}

.status-visible{
    background:#d1e7dd;
    color:#0f5132;
}

.status-hidden{
    background:#f8d7da;
    color:#842029;
}

.info{
    background:#e7f1ff;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<!-- تسجيل الدخول -->
<div id="loginPanel" class="card">

    <h1>🔐 لوحة تحكم فستق حلب</h1>

    <p>تسجيل دخول الإدارة</p>

    <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email">

    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password">

    <button onclick="login()">
        تسجيل الدخول
    </button>

    <p id="loginMessage" class="message"></p>

</div>


<!-- لوحة الإدارة -->
<div id="adminPanel">

    <div class="card">

        <h1>🍰 فستق حلب</h1>

        <p class="small">
            لوحة إدارة الأصناف والأسعار
        </p>

        <button class="logout" onclick="logout()">
            تسجيل الخروج
        </button>

    </div>


    <!-- إضافة صنف -->
    <div class="card">

        <h2>➕ إضافة صنف جديد</h2>

        <div class="info">
