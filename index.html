<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منيو</title>

<style>
:root{
    --primary:#789262;
    --bg:#d9e8b8;
    --text:#222;
    --card:#fff;
    --soft:#f7f9ef;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:var(--primary);
    color:#fff;
    text-align:center;
    padding:18px 10px;
}

header img{
    max-width:110px;
    max-height:80px;
    object-fit:contain;
    display:none;
    margin:0 auto 8px;
    border-radius:10px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:7px 0 0;
}

.container{
    max-width:760px;
    margin:auto;
    padding:15px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
}

.categories button{
    border:0;
    background:var(--soft);
    padding:10px 16px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
}

.categories button.active{
    background:var(--primary);
    color:#fff;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.item{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px #0002;
}

.item img{
    width:100%;
    height:155px;
    object-fit:cover;
}

.item-content{
    padding:12px;
}

.item h3{
    margin:0 0 6px;
}

.description{
    color:#777;
    font-size:13px;
    min-height:32px;
}

.price{
    font-size:17px;
    font-weight:bold;
    margin:10px 0;
    background:var(--soft);
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
}

.weight-box{
    display:none;
    margin-top:8px;
}

.weight-box.open{
    display:block;
}

.weight-select,
input,
textarea{
    width:100%;
    padding:11px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:inherit;
    background:#fff;
}

.add,
.whatsapp{
    width:100%;
    padding:11px;
    border:0;
    border-radius:8px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
}

.cart{
    background:#fff;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
}

.cart-item{
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-details{
    color:#666;
    font-size:14px;
    margin-top:5px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
}

.qty button{
    width:32px;
    height:32px;
    border:0;
    border-radius:6px;
    cursor:pointer;
}

.qty span{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

.whatsapp{
    background:#25D366;
    font-size:17px;
    font-weight:bold;
}

.empty,
.loading{
    text-align:center;
    color:#777;
    padding:20px;
}

/* سلة ثابتة مع العداد */
.floating-cart{
    position:fixed;
    bottom:18px;
    right:18px;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    font-size:25px;
    box-shadow:0 4px 14px #0004;
    z-index:20;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.cart-count{
    position:absolute;
    top:-5px;
    left:-5px;
    background:#c62828;
    color:#fff;
    border-radius:50%;
    min-width:24px;
    height:24px;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

#cartSection{
    scroll-margin-top:15px;
}

.delivery{
    background:#f7f7f7;
    padding:10px;
    border-radius:9px;
    margin:8px 0;
}

.delivery label{
    display:block;
    font-size:14px;
    margin-bottom:4px;
}

@media(max-width:500px){
    .menu{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <img id="logo" alt="الشعار">

    <h1 id="storeName">
        🍰 Pistach D'Alep
    </h1>

    <p id="storeSubtitle">
        بيستاش دي ألب
    </p>
</header>

<div class="container">

    <div class="categories" id="categories"></div>

    <div class="menu" id="menu">
        <div class="loading">
            جاري تحميل المنيو...
        </div>
    </div>

    <section class="cart" id="cartSection">

        <h2>🛒 سلة الطلب</h2>

        <div id="cartItems">
            <div class="empty">
                السلة فارغة
            </div>
        </div>

        <div class="total">
            الإجمالي:
            <span id="subtotal">0</span>
            جنيه
        </div>

        <div class="delivery">

            <label>
                🚚 منطقة التوصيل
            </label>

            <select id="region" onchange="updateCart()">

                <option value="">
                    اختر المنطقة
                </option>

            </select>

            <div>
                رسوم التوصيل:
                <strong>
                    <span id="deliveryFee">0</span>
                    جنيه
                </strong>
            </div>

        </div>

        <div class="total">
            الإجمالي النهائي:
            <span id="grandTotal">0</span>
            جنيه
        </div>

        <input
            id="name"
            placeholder="اسم العميل *"
        >

        <input
            id="phone"
            type="tel"
            placeholder="رقم الهاتف *"
        >

        <textarea
            id="address"
            rows="3"
            placeholder="العنوان بالتفصيل *"
        ></textarea>

        <button
            class="whatsapp"
            onclick="sendWhatsApp()"
        >
            📲 إرسال الطلب عبر واتساب
        </button>

    </section>

</div>

<!-- السلة الثابتة + العداد -->
<button
    class="floating-cart"
    onclick="document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})"
    aria-label="السلة"
>
    🛒
    <span class="cart-count" id="cartCount">0</span>
</button>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBoQHatPvFXnmCuI1M1UJcUWWQsB7vk3g0",

    authDomain:
    "pistach-d-alep.firebaseapp.com",

    projectId:
    "pistach-d-alep",

    storageBucket:
    "pistach-d-alep.firebasestorage.app",

    messagingSenderId:
    "288943885593",

    appId:
    "1:288943885593:web:4737041244be376c274988",

    measurementId:
    "G-569W2MXBTJ"

};


const db =
getFirestore(
    initializeApp(firebaseConfig)
);


const whatsappNumber =
"201010644644";


let products = [];
let cart = [];
let regions = [];
let categories = [];
let currentCategory = "الكل";
let settings = {};


const $ =
id =>
document.getElementById(id);


const esc =
v =>
String(v ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");


const num =
v =>
Number(v) || 0;


/* =========================
تحميل كل البيانات
========================= */

async function loadAll(){

    try{

        const [
            ps,
            rs,
            cs,
            ss
        ] = await Promise.all([

            getDocs(
                collection(db,"products")
            ),

            getDocs(
                collection(db,"deliveryRegions")
            ),

            getDocs(
                collection(db,"categories")
            ),

            getDoc(
                doc(db,"settings","main")
            )

        ]);


        products =
        ps.docs
        .map(
            d => ({
                id:d.id,
                ...d.data()
            })
        )
        .filter(
            p =>
            p.hidden !== true
        );


        regions =
        rs.docs
        .map(
            d => ({
                id:d.id,
                ...d.data()
            })
        )
        .sort(
            (a,b) =>
            (a.order ?? 999) -
            (b.order ?? 999)
        );


        categories =
        cs.docs
        .map(
            d => ({
                id:d.id,
                ...d.data()
            })
        )
        .sort(
            (a,b) =>
            (a.order ?? 999) -
            (b.order ?? 999)
        );


        settings =
        ss.exists()
        ? ss.data()
        : {};


        applySettings();

        showCategories();

        showProducts();

        showRegions();

    }
    catch(e){

        console.error(e);

        $("menu").innerHTML =
        '<div class="empty">حدث خطأ أثناء تحميل المنيو<br>' +
        esc(e.message) +
        '</div>';

    }

}


/* =========================
الإعدادات
========================= */

function applySettings(){

    document.documentElement.style.setProperty(
        "--primary",
        settings.primaryColor ||
        "#789262"
    );

    document.documentElement.style.setProperty(
        "--bg",
        settings.backgroundColor ||
        "#d9e8b8"
    );

    document.documentElement.style.setProperty(
        "--text",
        settings.textColor ||
        "#222"
    );


    $("storeName").textContent =
    settings.storeName ||
    "🍰 Pistach D'Alep";


    $("storeSubtitle").textContent =
    settings.subtitle ||
    "بيستاش دي ألب";


    document.title =
    settings.storeName ||
    "منيو";


    if(settings.logo){

        $("logo").src =
        settings.logo;

        $("logo").style.display =
        "block";

    }
    else{

        $("logo").style.display =
        "none";

    }

}


/* =========================
مناطق التوصيل
========================= */

function showRegions(){

    $("region").innerHTML =
    '<option value="">اختر المنطقة</option>' +

    regions.map(
        r =>
        `<option value="${esc(r.id)}">
            ${esc(r.name)} - ${num(r.fee)} جنيه
        </option>`
    )
    .join("");

}


/* =========================
الأقسام
========================= */

function showCategories(){

    const names =
    categories.length
    ?
    categories.map(
        c => c.name
    )
    :
    [
        ...new Set(
            products.map(
                p =>
                p.category ||
                "أخرى"
            )
        )
    ];


    const list = [
        "الكل",
        ...names.filter(
            x =>
            x &&
            x !== "الكل"
        )
    ];


    $("categories").innerHTML =
    list.map(
        c =>
        `<button
            class="${c === currentCategory ? "active" : ""}"
            data-cat="${esc(c)}"
        >
            ${esc(c)}
        </button>`
    )
    .join("");


    document
    .querySelectorAll(
        "#categories button"
    )
    .forEach(
        b => {

            b.onclick = () => {

                currentCategory =
                b.dataset.cat;

                showCategories();

                showProducts();

            };

        }
    );

}


/* =========================
استخراج سعر الكيلو
========================= */

function getKiloPrice(p){

    if(
        p.kiloPrice !== undefined &&
        num(p.kiloPrice) > 0
    ){

        return num(p.kiloPrice);

    }


    if(
        Array.isArray(p.units)
    ){

        const kilo =
        p.units.find(
            u =>
            String(u.name || "")
            .trim() === "كيلو" &&
            num(u.price) > 0
        );


        if(kilo){

            return num(kilo.price);

        }

    }


    if(
        p.prices &&
        typeof p.prices === "object" &&
        num(p.prices["كيلو"]) > 0
    ){

        return num(
            p.prices["كيلو"]
        );

    }


    return 0;

}


/* =========================
استخراج القطعة / العلبة
========================= */

function getExtraOption(p){

    let extraUnit =
    String(
        p.extraUnit || ""
    )
    .trim();


    let extraPrice =
    num(
        p.extraPrice
    );


    /* البيانات الجديدة */

    if(
        extraUnit &&
        extraPrice > 0
    ){

        return {
            name:extraUnit,
            price:extraPrice
        };

    }


    /* البحث في units */

    if(
        Array.isArray(p.units)
    ){

        const extra =
        p.units.find(
            u => {

                const name =
                String(
                    u.name || ""
                )
                .trim();


                return (
                    name &&
                    name !== "كيلو" &&
                    name !== "نصف كيلو" &&
                    name !== "ربع كيلو" &&
                    num(u.price) > 0
                );

            }
        );


        if(extra){

            return {
                name:
                String(
                    extra.name
                ).trim(),

                price:
                num(extra.price)
            };

        }

    }


    /* البحث في prices */

    if(
        p.prices &&
        typeof p.prices === "object"
    ){

        for(
            const [name,price]
            of Object.entries(p.prices)
        ){

            if(
                name !== "كيلو" &&
                name !== "نصف كيلو" &&
                name !== "ربع كيلو" &&
                num(price) > 0
            ){

                return {
                    name:name,
                    price:num(price)
                };

            }

        }

    }


    /*
    إذا لم يوجد كيلو
    وكان هناك سعر قطعة مباشر
    */

    if(
        num(p.price) > 0
    ){

        return {
            name:
            String(
                p.extraUnit ||
                "قطعة"
            ).trim(),

            price:
            num(p.price)
        };

    }


    return null;

}


/* =========================
خيارات المنتج
========================= */

function getOptions(p){

    const kilo =
    getKiloPrice(p);


    const extra =
    getExtraOption(p);


    const options = [];


    /*
    إذا يوجد سعر كيلو
    يظهر كيلو + نصف + ربع
    */

    if(kilo > 0){

        options.push({
            name:"كيلو",
            price:kilo
        });


        options.push({
            name:"نصف كيلو",
            price:kilo / 2
        });


        options.push({
            name:"ربع كيلو",
            price:kilo / 4
        });

    }


    /*
    إذا يوجد قطعة / علبة
    */

    if(extra){

        options.push(extra);

    }


    return options;

}


/* =========================
الخيار الافتراضي
========================= */

function getDefaultOption(p){

    const options =
    getOptions(p);


    /*
    إذا يوجد كيلو
    يظهر الكيلو أولًا
    */

    const kilo =
    options.find(
        o =>
        o.name === "كيلو"
    );


    if(kilo){

        return kilo;

    }


    /*
    إذا لا يوجد كيلو
    تظهر القطعة / العلبة
    */

    return options[0] ||
    {
        name:"قطعة",
        price:0
    };

}


/* =========================
عرض المنتجات
========================= */

function showProducts(){

    const list =
    currentCategory === "الكل"
    ?
    products
    :
    products.filter(
        p =>
        (p.category || "أخرى")
        === currentCategory
    );


    $("menu").innerHTML =
    list.length
    ?
    list.map(
        p => {

            const options =
            getOptions(p);


            const defaultOption =
            getDefaultOption(p);


            const optionHtml =
            options.map(
                o =>
                `<option
                    value="${esc(o.name)}"
                    ${o.name === defaultOption.name ? "selected" : ""}
                >
                    ${esc(o.name)} -
                    ${o.price} جنيه
                </option>`
            )
            .join("");


            const hasMultipleOptions =
            options.length > 1;


            return `

            <div class="item">

                ${
                    p.image
                    ?
                    `<img
                        src="${esc(p.image)}"
                        alt="${esc(p.name)}"
                        onerror="this.style.display='none'"
                    >`
                    :
                    ""
                }

                <div class="item-content">

                    <h3>
                        ${esc(p.name)}
                    </h3>

                    <div class="description">
                        ${esc(p.description)}
                    </div>


                    <div
                        class="price"
                        id="price-${esc(p.id)}"
                        ${
                            hasMultipleOptions
                            ?
                            `onclick="toggleWeight('${esc(p.id)}')"`
                            :
                            ""
                        }
                    >

                        ${esc(defaultOption.name)}
                        :
                        ${defaultOption.price}
                        جنيه

                        ${
                            hasMultipleOptions
                            ?
                            `<span style="font-size:12px">▾</span>`
                            :
                            ""
                        }

                    </div>


                    <div
                        class="weight-box"
                        id="weight-box-${esc(p.id)}"
                    >

                        ${
                            hasMultipleOptions
                            ?
                            `
                            <select
                                class="weight-select"
                                id="unit-${esc(p.id)}"
                                onchange="changeDisplayedPrice('${esc(p.id)}')"
                            >
                                ${optionHtml}
                            </select>
                            `
                            :
                            `
                            <input
                                type="hidden"
                                id="unit-${esc(p.id)}"
                                value="${esc(defaultOption.name)}"
                            >
                            `
                        }

                    </div>


                    <button
                        class="add"
                        onclick="addToCart('${esc(p.id)}')"
                    >
                        ➕ إضافة للسلة
                    </button>

                </div>

            </div>

            `;

        }
    )
    .join("")
    :
    '<div class="empty">لا توجد أصناف متاحة حاليًا</div>';

}


/* =========================
فتح الخيارات
========================= */

window.toggleWeight =
function(id){

    const box =
    $("weight-box-" + id);


    if(!box)
    return;


    box.classList.toggle(
        "open"
    );

};


/* =========================
تغيير السعر الظاهر
========================= */

window.changeDisplayedPrice =
function(id){

    const select =
    $("unit-" + id);


    const priceBox =
    $("price-" + id);


    if(
        !select ||
        !priceBox
    )
    return;


    const p =
    products.find(
        x =>
        x.id === id
    );


    if(!p)
    return;


    const options =
    getOptions(p);


    const selected =
    options.find(
        x =>
        x.name === select.value
    );


    if(!selected)
    return;


    priceBox.innerHTML =
    `${esc(selected.name)}
    :
    ${selected.price}
    جنيه
    <span style="font-size:12px">
        ▾
    </span>`;

};


/* =========================
إضافة للسلة
========================= */

window.addToCart =
function(id){

    const p =
    products.find(
        x =>
        x.id === id
    );


    if(!p)
    return;


    const select =
