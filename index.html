<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فستق حلب</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#789262;
    color:white;
    padding:18px 15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:50%;
    background:white;
    margin-bottom:8px;
}

header h1{
    margin:5px 0;
    font-size:24px;
}

header p{
    margin:4px 0 0;
    font-size:14px;
    opacity:.9;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:5px 0 15px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{
    border:0;
    background:white;
    color:#555;
    padding:10px 18px;
    border-radius:25px;
    white-space:nowrap;
    cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    font-size:14px;
}

.category-btn.active{
    background:#789262;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:15px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
}

.product-image{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#eee;
}

.product-content{
    padding:14px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:6px;
}

.product-description{
    font-size:13px;
    color:#777;
    line-height:1.6;
    margin-bottom:10px;
}

.price-main{
    font-size:18px;
    font-weight:bold;
    color:#789262;
    margin-bottom:10px;
}

.price-select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    font-size:14px;
    margin-bottom:10px;
}

.add-btn{
    width:100%;
    border:0;
    background:#789262;
    color:white;
    padding:12px;
    border-radius:9px;
    font-size:15px;
    cursor:pointer;
    margin-top:auto;
}

.add-btn:hover{
    opacity:.9;
}

.custom-price{
    color:#789262;
    font-weight:bold;
    margin-bottom:10px;
    font-size:16px;
}

.empty{
    background:white;
    border-radius:15px;
    padding:30px 20px;
    text-align:center;
    color:#777;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.error-box{
    background:#fff1f1;
    color:#a40000;
    border:1px solid #e2aaaa;
    border-radius:12px;
    padding:18px;
    margin:20px 0;
    line-height:1.8;
    direction:rtl;
    text-align:right;
    word-break:break-word;
}

.error-box code{
    display:block;
    background:#fff;
    padding:8px;
    border-radius:6px;
    direction:ltr;
    text-align:left;
    margin-top:8px;
}

.delivery-box{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.delivery-box h3{
    margin-top:0;
}

.delivery-select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    font-size:15px;
}

.cart-section{
    margin-top:25px;
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.cart-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:bold;
    margin-bottom:4px;
}

.cart-item-unit{
    font-size:13px;
    color:#777;
}

.cart-item-price{
    font-size:14px;
    color:#789262;
    margin-top:4px;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty-btn{
    width:30px;
    height:30px;
    border:0;
    border-radius:7px;
    background:#789262;
    color:white;
    cursor:pointer;
    font-size:17px;
}

.qty-number{
    min-width:25px;
    text-align:center;
}

.remove-btn{
    border:0;
    background:#eee;
    color:#a00;
    border-radius:7px;
    padding:7px 9px;
    cursor:pointer;
}

.cart-summary{
    margin-top:15px;
    border-top:1px solid #eee;
    padding-top:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.summary-total{
    font-size:20px;
    font-weight:bold;
    color:#789262;
}

.whatsapp-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.floating-cart{
    position:fixed;
    left:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:0;
    background:#789262;
    color:white;
    font-size:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    cursor:pointer;
    z-index:2000;
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-5px;
    background:#d9534f;
    color:white;
    width:23px;
    height:23px;
    border-radius:50%;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

footer{
    text-align:center;
    padding:30px 15px 90px;
    color:#777;
    font-size:13px;
}

.social-links{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.social-links a{
    text-decoration:none;
    color:#789262;
}

@media(max-width:600px){

    .products{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .product-image{
        height:145px;
    }

    .product-content{
        padding:10px;
    }

    .product-name{
        font-size:16px;
    }

    .product-description{
        font-size:12px;
    }

    .price-main{
        font-size:16px;
    }

    .add-btn{
        padding:10px;
        font-size:14px;
    }
}

@media(max-width:380px){

    .products{
        grid-template-columns:1fr;
    }

    .product-image{
        height:180px;
    }
}
</style>
</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:"AIzaSyBoQHatPvFXnmCuI1M1UJcUWWQsB7vk3g0",

    authDomain:"pistach-d-alep.firebaseapp.com",

    projectId:"pistach-d-alep",

    storageBucket:"pistach-d-alep.firebasestorage.app",

    messagingSenderId:"288943885593",

    measurementId:"G-569W2MXBTJ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   VARIABLES
========================= */

let products = [];

let cart = [];

let regions = [];

let categories = [];

let currentCategory = "الكل";

let settings = {};


/* =========================
   HELPERS
========================= */

function $(id){

    return document.getElementById(id);

}


function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function num(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


function money(value){

    return `${num(value).toLocaleString("ar-EG")} جنيه`;

}


/* =========================
   GET PRODUCT OPTIONS
========================= */

function getOptions(product){

    if(
        Array.isArray(product.units)
    ){

        return product.units
            .map(unit => ({
                name:String(unit.name ?? "").trim(),
                price:num(unit.price)
            }))
            .filter(unit =>
                unit.name &&
                unit.price > 0
            );

    }


    if(
        Array.isArray(product.prices)
    ){

        return product.prices
            .map(unit => ({
                name:String(unit.name ?? "").trim(),
                price:num(unit.price)
            }))
            .filter(unit =>
                unit.name &&
                unit.price > 0
            );

    }


    if(
        product.price !== undefined &&
        product.price !== null
    ){

        return [{
            name:"قطعة",
            price:num(product.price)
        }].filter(unit =>
            unit.price > 0
        );

    }


    if(
        Array.isArray(product.weights)
    ){

        return product.weights
            .map(unit => ({
                name:String(unit.name ?? "").trim(),
                price:num(unit.price)
            }))
            .filter(unit =>
                unit.name &&
                unit.price > 0
            );

    }


    return [];

}


/* =========================
   PRICING TYPE
========================= */

function getPricingType(product,options){

    if(product.pricingType){

        return product.pricingType;

    }


    const names = options.map(
        x => x.name.trim()
    );


    if(
        names.includes("كيلو") ||
        names.includes("نصف كيلو") ||
        names.includes("ربع كيلو")
    ){

        return "kilo";

    }


    return "piece";

}


/* =========================
   SORT OPTIONS
========================= */

function sortOptions(product,options){

    const type =
        getPricingType(product,options);


    if(type === "kilo"){

        const order = [
            "كيلو",
            "نصف كيلو",
            "ربع كيلو"
        ];


        return [...options].sort((a,b)=>{

            const ai = order.indexOf(a.name);

            const bi = order.indexOf(b.name);

            if(ai !== -1 && bi !== -1){

                return ai - bi;

            }

            if(ai !== -1) return -1;

            if(bi !== -1) return 1;

            return b.price - a.price;

        });

    }


    return [...options];

}


/* =========================
   MAIN PRICE
========================= */

function getMainPrice(product){

    const options =
        sortOptions(
            product,
            getOptions(product)
        );


    const type =
        getPricingType(product,options);


    if(type === "custom"){

        return null;

    }


    if(type === "kilo"){

        const kilo =
            options.find(
                x => x.name === "كيلو"
            );

        return kilo ? kilo.price : null;

    }


    if(
        type === "piece" ||
        type === "box"
    ){

        return options.length
            ? options[0].price
            : null;

    }


    return options.length
        ? options[0].price
        : null;

}


/* =========================
   APPLY SETTINGS
========================= */

function applySettings(){

    if(!settings){
        return;
    }


    const logoUrl =
        settings.logoUrl ||
        settings.logo ||
        "";


    if(logoUrl){

        $("logo").src = logoUrl;

        $("logo").style.display =
            "inline-block";

    }


    if(settings.storeName){

        $("storeName").textContent =
            settings.storeName;

        document.title =
            settings.storeName;

    }


    if(settings.description){

        $("storeDescription")
            .textContent =
            settings.description;

    }


    if(settings.footerText){

        $("footerText")
            .textContent =
            settings.footerText;

    }


    const social =
        settings.socialMedia ||
        settings.socialLinks ||
        {};


    const socialContainer =
        $("socialLinks");


    socialContainer.innerHTML = "";


    if(typeof social === "object"){

        Object.entries(social)
            .forEach(([name,url])=>{

                if(!url){
                    return;
                }


                socialContainer.innerHTML += `

                    <a
                        href="${esc(url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${esc(name)}
                    </a>

                `;

            });

    }

}


/* =========================
   SHOW CATEGORIES
========================= */

function showCategories(){

    const container =
        $("categories");


    container.innerHTML = "";


    const allButton =
        document.createElement("button");


    allButton.className =
        "category-btn" +
        (
            currentCategory === "الكل"
                ? " active"
                : ""
        );


    allButton.textContent =
        "الكل";


    allButton.onclick = ()=>{

        currentCategory = "الكل";

        showCategories();

        showProducts();

    };


    container.appendChild(allButton);


    categories.forEach(category=>{

        const button =
            document.createElement("button");


        button.className =
            "category-btn" +
            (
                currentCategory === category.id ||
                currentCategory === category.name
                    ? " active"
                    : ""
            );


        button.textContent =
            category.name;


        button.onclick = ()=>{

            currentCategory =
                category.id ||
                category.name;

            showCategories();

            showProducts();

        };


        container.appendChild(button);

    });

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(){

    const container =
        $("menu");


    container.innerHTML = "";


    let list =
        [...products];


    if(currentCategory !== "الكل"){

        list =
            list.filter(product =>{

                return (
                    product.category ===
                    currentCategory
                );

            });

    }


    list.sort((a,b)=>{

        return (
            num(a.order || 999) -
            num(b.order || 999)
        );

    });


    if(!list.length){

        container.innerHTML = `

            <div class="empty">

                لا توجد أصناف حالياً

            </div>

        `;

        return;

    }


    list.forEach(product=>{

        const card =
            document.createElement("div");


        card.className =
            "product-card";


        const image =
            product.image ||
            product.imageUrl ||
            "";


        const options =
            sortOptions(
                product,
                getOptions(product)
            );


        const pricingType =
            getPricingType(
                product,
                options
            );


        let pricingHTML = "";


        /* CUSTOM */

        if(pricingType === "custom"){

            pricingHTML = `

                <div class="custom-price">

                    📝 السعر حسب الطلب

                </div>

            `;

        }


        /* MORE THAN ONE PRICE */

        else if(options.length > 1){

            pricingHTML = `

                <select class="price-select">

                    ${options.map((option,index)=>`

                        <option
                            value="${index}"
                        >
                            ${esc(option.name)}
                            -
                            ${money(option.price)}
                        </option>

                    `).join("")}

                </select>

            `;

        }


        /* ONE PRICE */

        else if(options.length === 1){

            pricingHTML = `

                <div class="price-main">

                    ${esc(options[0].name)}
                    -
                    ${money(options[0].price)}

                </div>

            `;

        }


        /* NO PRICE */

        else{

            pricingHTML = `

                <div class="custom-price">

                    السعر حسب الطلب

                </div>

            `;

        }


        card.innerHTML = `

            ${
                image
                ?
                `
                    <img
                        class="product-image"
                        src="${esc(image)}"
                        alt="${esc(product.name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >
                `
                :
                `
                    <div
                        class="product-image"
                    ></div>
                `
            }


            <div class="product-content">

                <div class="product-name">

                    ${esc(product.name)}

                </div>


                ${
                    product.description
                    ?
                    `
                        <div
                            class="product-description"
                        >
                            ${esc(product.description)}
                        </div>
                    `
                    :
                    ""
                }


                ${pricingHTML}


                <button
                    class="add-btn"
                    data-add-product="${esc(product.id)}"
                    type="button"
                >

                    إضافة للسلة 🛒

                </button>

            </div>

        `;


        container.appendChild(card);

    });


    container
        .querySelectorAll("[data-add-product]")
        .forEach(button=>{

            button.addEventListener(
            
    container
        .querySelectorAll("[data-add-product]")
        .forEach(button => {
            button.addEventListener("click", () => {
                const product = products.find(
                    item => item.id === button.dataset.addProduct
                );

                if (!product) return;

                const options = sortOptions(product, getOptions(product));
                const card = button.closest(".product-card");
                const select = card.querySelector(".price-select");
                const selectedIndex = select ? Number(select.value) : 0;
                const option = options[selectedIndex];

                const custom = getPricingType(product, options) === "custom"
                    || !option;

                const unitName = custom
                    ? "حسب الطلب"
                    : option.name;

                const price = custom ? 0 : option.price;

                const existing = cart.find(item =>
                    item.productId === product.id &&
                    item.unitName === unitName
                );

                if (existing) {
                    existing.qty += 1;
                } else {
                    cart.push({
                        productId: product.id,
                        name: product.name || "صنف",
                        unitName,
                        price,
                        qty: 1,
                        custom
                    });
                }

                renderCart();
                button.textContent = "تمت الإضافة ✓";
                setTimeout(() => {
                    button.textContent = "إضافة للسلة 🛒";
                }, 900);
            });
        });
}

/* عرض السلة وحساب الأسعار */
function renderCart() {
    const container = $("cartItems");
    container.innerHTML = "";

    if (!cart.length) {
        container.innerHTML =
            '<div class="empty">السلة فارغة، أضف الأصناف التي تريدها</div>';
    }

    cart.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "cart-item";

        row.innerHTML = `
            <div class="cart-item-info">
                <div class="cart-item-name">${esc(item.name)}</div>
                <div class="cart-item-unit">${esc(item.unitName)}</div>
                <div class="cart-item-price">
                    ${item.custom ? "السعر حسب الطلب" : money(item.price * item.qty)}
                </div>
            </div>
            <div class="cart-controls">
                <button class="qty-btn" data-minus="${index}" type="button">−</button>
                <span class="qty-number">${item.qty}</span>
                <button class="qty-btn" data-plus="${index}" type="button">+</button>
                <button class="remove-btn" data-remove="${index}" type="button">حذف</button>
            </div>
        `;

        container.appendChild(row);
    });

    container.querySelectorAll("[data-plus]").forEach(button => {
        button.addEventListener("click", () => {
            cart[Number(button.dataset.plus)].qty++;
            renderCart();
        });
    });

    container.querySelectorAll("[data-minus]").forEach(button => {
        button.addEventListener("click", () => {
            const index = Number(button.dataset.minus);
            cart[index].qty--;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            renderCart();
        });
    });

    container.querySelectorAll("[data-remove]").forEach(button => {
        button.addEventListener("click", () => {
            cart.splice(Number(button.dataset.remove), 1);
            renderCart();
        });
    });

    const subtotal = cart.reduce(
        (sum, item) => sum + item.price * item.qty, 0
    );

    const region = regions.find(
        item => item.id === $("deliveryRegion").value
    );

    const deliveryFee = region
        ? num(region.fee ?? region.deliveryFee ?? region.price ?? region.cost)
        : 0;

    $("subtotal").textContent = money(subtotal);
    $("deliveryFee").textContent = money(deliveryFee);
    $("grandTotal").textContent = money(subtotal + deliveryFee);
    $("cartCount").textContent = cart.reduce(
        (sum, item) => sum + item.qty, 0
    );
}

/* تحميل مناطق التوصيل */
function showRegions() {
    const select = $("deliveryRegion");
    select.innerHTML = '<option value="">اختر منطقة التوصيل</option>';

    regions.forEach(region => {
        const option = document.createElement("option");
        option.value = region.id;
        option.textContent =
            `${region.name || region.title || "منطقة"} — ${
                money(region.fee ?? region.deliveryFee ?? region.price ?? region.cost)
            }`;
        select.appendChild(option);
    });
}

/* إرسال الطلب إلى واتساب */
$("whatsappBtn").addEventListener("click", () => {
    if (!cart.length) {
        alert("أضف صنفاً واحداً على الأقل إلى السلة.");
        return;
    }

    const selectedRegion = regions.find(
        item => item.id === $("deliveryRegion").value
    );

    if (regions.length && !selectedRegion) {
        alert("اختر منطقة التوصيل أولاً.");
        return;
    }

    const subtotal = cart.reduce(
        (sum, item) => sum + item.price * item.qty, 0
    );

    const deliveryFee = selectedRegion
        ? num(selectedRegion.fee ?? selectedRegion.deliveryFee ??
              selectedRegion.price ?? selectedRegion.cost)
        : 0;

    let message = "طلب جديد من فستق حلب\n\n";

    cart.forEach(item => {
        message += `• ${item.name} — ${item.unitName} — الكمية: ${item.qty}`;
        message += item.custom
            ? " — السعر يحدد عند التأكيد\n"
            : ` — ${money(item.price * item.qty)}\n`;
    });

    message += `\nالمجموع: ${money(subtotal)}`;
    message += `\nالتوصيل: ${money(deliveryFee)}`;
    message += `\nالإجمالي المبدئي: ${money(subtotal + deliveryFee)}`;

    if (selectedRegion) {
        message += `\nمنطقة التوصيل: ${selectedRegion.name || selectedRegion.title || ""}`;
    }

    const phone = String(
        settings.whatsapp ||
        settings.whatsappNumber ||
        settings.phoneNumber ||
        settings.phone ||
        ""
    ).replace(/[^\d]/g, "");

    if (!phone) {
        alert("رقم واتساب غير موجود في إعدادات المتجر بلوحة التحكم.");
        return;
    }

    window.open(
        "https://wa.me/" + phone + "?text=" + encodeURIComponent(message),
        "_blank"
    );
});

/* زر السلة العائم */
$("floatingCart").addEventListener("click", () => {
    document.querySelector(".cart-section").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
});

/* تحميل بيانات Firebase */
async function loadAll() {
    $("menu").innerHTML = '<div class="empty">جارٍ تحميل الأصناف...</div>';

    try {
        const [productSnap, regionSnap, categorySnap, settingsSnap] =
            await Promise.all([
                getDocs(collection(db, "products")),
                getDocs(collection(db, "deliveryRegions")),
                getDocs(collection(db, "categories")),
                getDoc(doc(db, "settings", "main"))
            ]);

        products = productSnap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(p => p.hidden !== true);

        regions = regionSnap.docs.map(d => ({
            id: d.id, ...d.data()
        }));

        categories = categorySnap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(c => c.hidden !== true);

        settings = settingsSnap.exists()
            ? settingsSnap.data()
            : {};

        applySettings();
        showCategories();
        showRegions();
        showProducts();
        renderCart();

        if (!products.length) {
            $("menu").innerHTML =
                '<div class="empty">لا توجد أصناف في مجموعة products بقاعدة البيانات.</div>';
        }
    } catch (error) {
        console.error("Firebase loading error:", error);

        $("errorContainer").innerHTML = `
            <div class="error-box">
                <strong>تعذر تحميل المنيو من قاعدة البيانات.</strong>
                <p>تأكد من اتصال الإنترنت وصلاحيات قراءة بيانات Firebase.</p>
                <code>${esc(error.code || error.message || "خطأ غير معروف")}</code>
                <button id="retryLoad" type="button">إعادة المحاولة</button>
            </div>
        `;

        $("retryLoad").addEventListener("click", loadAll);
        $("menu").innerHTML = "";
    }
}

$("deliveryRegion").addEventListener("change", renderCart);

loadAll();
</script>
</body>
</html>
