<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فستق حلب</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#789262;
    color:white;
    padding:18px 15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.logo{
    width:75px;
    height:75px;
    object-fit:cover;
    border-radius:50%;
    background:white;
    margin-bottom:8px;
}

header h1{
    margin:5px 0;
    font-size:24px;
}

header p{
    margin:4px 0 0;
    font-size:14px;
    opacity:.9;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:15px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:5px 0 15px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-btn{
    border:0;
    background:white;
    color:#555;
    padding:10px 18px;
    border-radius:25px;
    white-space:nowrap;
    cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.08);
    font-size:14px;
}

.category-btn.active{
    background:#789262;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:15px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
}

.product-image{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#eee;
}

.product-content{
    padding:14px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.product-name{
    font-size:19px;
    font-weight:bold;
    margin-bottom:6px;
}

.product-description{
    font-size:13px;
    color:#777;
    line-height:1.6;
    margin-bottom:10px;
}

.price-main{
    font-size:18px;
    font-weight:bold;
    color:#789262;
    margin-bottom:10px;
}

.price-select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    font-size:14px;
    margin-bottom:10px;
}

.add-btn{
    width:100%;
    border:0;
    background:#789262;
    color:white;
    padding:12px;
    border-radius:9px;
    font-size:15px;
    cursor:pointer;
    margin-top:auto;
}

.add-btn:hover{
    opacity:.9;
}

.custom-price{
    color:#789262;
    font-weight:bold;
    margin-bottom:10px;
    font-size:16px;
}

.empty{
    background:white;
    border-radius:15px;
    padding:30px 20px;
    text-align:center;
    color:#777;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.error-box{
    background:#fff1f1;
    color:#a40000;
    border:1px solid #e2aaaa;
    border-radius:12px;
    padding:18px;
    margin:20px 0;
    line-height:1.8;
    direction:rtl;
    text-align:right;
    word-break:break-word;
}

.error-box code{
    display:block;
    background:#fff;
    padding:8px;
    border-radius:6px;
    direction:ltr;
    text-align:left;
    margin-top:8px;
}

.delivery-box{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.delivery-box h3{
    margin-top:0;
}

.delivery-select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:9px;
    background:white;
    font-size:15px;
}

.cart-section{
    margin-top:25px;
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.cart-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:bold;
    margin-bottom:4px;
}

.cart-item-unit{
    font-size:13px;
    color:#777;
}

.cart-item-price{
    font-size:14px;
    color:#789262;
    margin-top:4px;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty-btn{
    width:30px;
    height:30px;
    border:0;
    border-radius:7px;
    background:#789262;
    color:white;
    cursor:pointer;
    font-size:17px;
}

.qty-number{
    min-width:25px;
    text-align:center;
}

.remove-btn{
    border:0;
    background:#eee;
    color:#a00;
    border-radius:7px;
    padding:7px 9px;
    cursor:pointer;
}

.cart-summary{
    margin-top:15px;
    border-top:1px solid #eee;
    padding-top:15px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
}

.summary-total{
    font-size:20px;
    font-weight:bold;
    color:#789262;
}

.whatsapp-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#25D366;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.floating-cart{
    position:fixed;
    left:18px;
    bottom:18px;
    width:58px;
    height:58px;
    border-radius:50%;
    border:0;
    background:#789262;
    color:white;
    font-size:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    cursor:pointer;
    z-index:2000;
}

.cart-count{
    position:absolute;
    top:-5px;
    right:-5px;
    background:#d9534f;
    color:white;
    width:23px;
    height:23px;
    border-radius:50%;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

footer{
    text-align:center;
    padding:30px 15px 90px;
    color:#777;
    font-size:13px;
}

.social-links{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.social-links a{
    text-decoration:none;
    color:#789262;
}

@media(max-width:600px){

    .products{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .product-image{
        height:145px;
    }

    .product-content{
        padding:10px;
    }

    .product-name{
        font-size:16px;
    }

    .product-description{
        font-size:12px;
    }

    .price-main{
        font-size:16px;
    }

    .add-btn{
        padding:10px;
        font-size:14px;
    }
}

@media(max-width:380px){

    .products{
        grid-template-columns:1fr;
    }

    .product-image{
        height:180px;
    }
}
</style>
</head>

<body>

<header>

    <img
        id="logo"
        class="logo"
        src=""
        alt="فستق حلب"
        style="display:none"
    >

    <h1 id="storeName">فستق حلب</h1>

    <p id="storeDescription">
        أهلاً وسهلاً بكم
    </p>

</header>


<div class="container">

    <div id="errorContainer"></div>

    <div
        id="categories"
        class="categories"
    ></div>

    <div
        id="menu"
        class="products"
    ></div>


    <div class="delivery-box">

        <h3>🚚 منطقة التوصيل</h3>

        <select
            id="deliveryRegion"
            class="delivery-select"
        >
            <option value="">
                اختر منطقة التوصيل
            </option>
        </select>

    </div>


    <div class="cart-section">

        <div class="cart-title">

                <span>المجموع</span>

                <span>الإجمالي</span>

            <button

            >
                📱 إرسال الطلب عبر واتساب
            </button>

</div>


<footer>

    <div id="footerText">

    <div
        id="socialLinks"

</footer>


<button
    id="floatingCart"

>
    🛒

    <span
        id="cartCount"
        class="cart-count"
    >
        0
    </span>

</button>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:"AIzaSyBoQHatPvFXnmCuI1M1UJcUWWQsB7vk3g0",

    authDomain:"pistach-d-alep.firebaseapp.com",

    projectId:"pistach-d-alep",

    storageBucket:"pistach-d-alep.firebasestorage.app",

    messagingSenderId:"288943885593",

    appId:"1:288943885593:web:4737041244be376c274988",

    measurementId:"G-569W2MXBTJ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   VARIABLES
========================= */

let products = [];

let cart = [];

let regions = [];

let categories = [];

let currentCategory = "الكل";

let settings = {};


/* =========================
   HELPERS
========================= */

function $(id){

    return document.getElementById(id);

}


function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function num(value){

    const n = Number(value);

    return Number.isFinite(n) ? n : 0;

}


function money(value){

    return `${num(value).toLocaleString("ar-EG")} جنيه`;

}


/* =========================
   GET PRODUCT OPTIONS
========================= */

function getOptions(product){

    if(
        Array.isArray(product.units)
    ){

        return product.units
            .map(unit => ({
                name:String(unit.name ?? "").trim(),
                price:num(unit.price)
            }))
            .filter(unit =>
                unit.name &&
                unit.price > 0
            );

    }


    if(
        Array.isArray(product.prices)
    ){

        return product.prices
            .map(unit => ({
                name:String(unit.name ?? "").trim(),
                price:num(unit.price)
            }))
            .filter(unit =>
                unit.name &&
                unit.price > 0
            );

    }


    if(
        product.price !== undefined &&
        product.price !== null
    ){

        return [{
            name:"قطعة",
            price:num(product.price)
        }].filter(unit =>
            unit.price > 0
        );

    }


    if(
        Array.isArray(product.weights)
    ){

        return product.weights
            .map(unit => ({
                name:String(unit.name ?? "").trim(),
                price:num(unit.price)
            }))
            .filter(unit =>
                unit.name &&
                unit.price > 0
            );

    }


    return [];

}


/* =========================
   PRICING TYPE
========================= */

function getPricingType(product,options){

    if(product.pricingType){

        return product.pricingType;

    }


    const names = options.map(
        x => x.name.trim()
    );


    if(
        names.includes("كيلو") ||
        names.includes("نصف كيلو") ||
        names.includes("ربع كيلو")
    ){

        return "kilo";

    }


    return "piece";

}


/* =========================
   SORT OPTIONS
========================= */

function sortOptions(product,options){

    const type =
        getPricingType(product,options);


    if(type === "kilo"){

        const order = [
            "كيلو",
            "نصف كيلو",
            "ربع كيلو"
        ];


        return [...options].sort((a,b)=>{

            const ai = order.indexOf(a.name);

            const bi = order.indexOf(b.name);

            if(ai !== -1 && bi !== -1){

                return ai - bi;

            }

            if(ai !== -1) return -1;

            if(bi !== -1) return 1;

            return b.price - a.price;

        });

    }


    return [...options];

}


/* =========================
   MAIN PRICE
========================= */

function getMainPrice(product){

    const options =
        sortOptions(
            product,
            getOptions(product)
        );


    const type =
        getPricingType(product,options);


    if(type === "custom"){

        return null;

    }


    if(type === "kilo"){

        const kilo =
            options.find(
                x => x.name === "كيلو"
            );

        return kilo ? kilo.price : null;

    }


    if(
        type === "piece" ||
        type === "box"
    ){

        return options.length
            ? options[0].price
            : null;

    }


    return options.length
        ? options[0].price
        : null;

}


/* =========================
   APPLY SETTINGS
========================= */

function applySettings(){

    if(!settings){
        return;
    }


    const logoUrl =
        settings.logoUrl ||
        settings.logo ||
        "";


    if(logoUrl){

        $("logo").src = logoUrl;

        $("logo").style.display =
            "inline-block";

    }


    if(settings.storeName){

        $("storeName").textContent =
            settings.storeName;

        document.title =
            settings.storeName;

    }


    if(settings.description){

        $("storeDescription")
            .textContent =
            settings.description;

    }


    if(settings.footerText){

        $("footerText")
            .textContent =
            settings.footerText;

    }


    const social =
        settings.socialMedia ||
        settings.socialLinks ||
        {};


    const socialContainer =
        $("socialLinks");


    socialContainer.innerHTML = "";


    if(typeof social === "object"){

        Object.entries(social)
            .forEach(([name,url])=>{

                if(!url){
                    return;
                }


                socialContainer.innerHTML += `

                    <a
                        href="${esc(url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${esc(name)}
                    </a>

                `;

            });

    }

}


/* =========================
   SHOW CATEGORIES
========================= */

function showCategories(){

    const container =
        $("categories");


    container.innerHTML = "";


    const allButton =
        document.createElement("button");


    allButton.className =
        "category-btn" +
        (
            currentCategory === "الكل"
                ? " active"
                : ""
        );


    allButton.textContent =
        "الكل";


    allButton.onclick = ()=>{

        currentCategory = "الكل";

        showCategories();

        showProducts();

    };


    container.appendChild(allButton);


    categories.forEach(category=>{

        const button =
            document.createElement("button");


        button.className =
            "category-btn" +
            (
                currentCategory === category.id ||
                currentCategory === category.name
                    ? " active"
                    : ""
            );


        button.textContent =
            category.name;


        button.onclick = ()=>{

            currentCategory =
                category.id ||
                category.name;

            showCategories();

            showProducts();

        };


        container.appendChild(button);

    });

}


/* =========================
   SHOW PRODUCTS
========================= */

function showProducts(){

    const container =
        $("menu");


    container.innerHTML = "";


    let list =
        [...products];


    if(currentCategory !== "الكل"){

        list =
            list.filter(product =>{

                return (
                    product.category ===
                    currentCategory
                );

            });

    }


    list.sort((a,b)=>{

        return (
            num(a.order || 999) -
            num(b.order || 999)
        );

    });


    if(!list.length){

        container.innerHTML = `

            <div class="empty">

                لا توجد أصناف حالياً

            </div>

        `;

        return;

    }


    list.forEach(product=>{

        const card =
            document.createElement("div");


        card.className =
            "product-card";


        const image =
            product.image ||
            product.imageUrl ||
            "";


        const options =
            sortOptions(
                product,
                getOptions(product)
            );


        const pricingType =
            getPricingType(
                product,
                options
            );


        let pricingHTML = "";


        /* CUSTOM */

        if(pricingType === "custom"){

            pricingHTML = `

                <div class="custom-price">

                    📝 السعر حسب الطلب

                </div>

            `;

        }


        /* MORE THAN ONE PRICE */

        else if(options.length > 1){

            pricingHTML = `

                <select class="price-select">

                    ${options.map((option,index)=>`

                        <option
                            value="${index}"
                        >
                            ${esc(option.name)}
                            -
                            ${money(option.price)}
                        </option>

                    `).join("")}

                </select>

            `;

        }


        /* ONE PRICE */

        else if(options.length === 1){

            pricingHTML = `

                <div class="price-main">

                    ${esc(options[0].name)}
                    -
                    ${money(options[0].price)}

                </div>

            `;

        }


        /* NO PRICE */

        else{

            pricingHTML = `

                <div class="custom-price">

                    السعر حسب الطلب

                </div>

            `;

        }


        card.innerHTML = `

            ${
                image
                ?
                `
                    <img
                        class="product-image"
                        src="${esc(image)}"
                        alt="${esc(product.name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                        "
                    >
                `
                :
                `
                    <div
                        class="product-image"
                    ></div>
                `
            }


            <div class="product-content">

                <div class="product-name">

                    ${esc(product.name)}

                </div>


                ${
                    product.description
                    ?
                    `
                        <div
                            class="product-description"
                        >
                            ${esc(product.description)}
                        </div>
                    `
                    :
                    ""
                }


                ${pricingHTML}


                <button
                    class="add-btn"
                    data-add-product="${esc(product.id)}"
                    type="button"
                >

                    إضافة للسلة 🛒

                </button>

            </div>

        `;


        container.appendChild(card);

    });


    container
        .querySelectorAll("[data-add-product]")
        .forEach(button=>{

            button.addEventListener(
