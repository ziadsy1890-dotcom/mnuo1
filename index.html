<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pistach D'Alep</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#d9e8b8;
    color:#222;
}

header{
    background:#789262;
    color:white;
    text-align:center;
    padding:22px 10px;
}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
    color:#f1f5e8;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
}

.categories button{
    border:0;
    background:#f7f9ef;
    padding:10px 16px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
}

.categories button.active{
    background:#789262;
    color:white;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.item{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px #00000015;
}

.item img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.item-content{
    padding:12px;
}

.item h3{
    margin:0 0 6px;
}

.description{
    color:#777;
    font-size:13px;
    min-height:35px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin:8px 0;
}

.add{
    width:100%;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#789262;
    color:white;
    cursor:pointer;
}

.weight-select{
    width:100%;
    padding:10px;
    margin:7px 0;
    border:1px solid #cbd5b8;
    border-radius:8px;
    background:white;
}

.max-info{
    color:#777;
    font-size:12px;
    margin:5px 0;
}

.cart{
    background:white;
    margin-top:20px;
    padding:15px;
    border-radius:12px;
}

.cart-item{
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-details{
    color:#666;
    font-size:14px;
    margin-top:5px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
}

.qty button{
    width:32px;
    height:32px;
    border:0;
    border-radius:6px;
    cursor:pointer;
}

.qty span{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin:15px 0;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:inherit;
}

.whatsapp{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#888;
    padding:15px;
}

.loading{
    text-align:center;
    padding:30px;
}

@media(max-width:500px){

    .menu{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>

    <h1>🍰 Pistach D'Alep</h1>

    <p>بيستاش دي ألب</p>

</header>

<div class="container">

    <div
        class="categories"
        id="categories">
    </div>

    <div
        class="menu"
        id="menu">

        <div class="loading">
            جاري تحميل المنيو...
        </div>

    </div>

    <div class="cart">

        <h2>🛒 سلة الطلب</h2>

        <div id="cartItems">

            <div class="empty">
                السلة فارغة
            </div>

        </div>

        <div class="total">

            الإجمالي:
            <span id="total">0</span>
            جنيه

        </div>

        <input
            id="name"
            placeholder="اسم العميل *">

        <input
            id="phone"
            type="tel"
            placeholder="رقم الهاتف *">

        <textarea
            id="address"
            rows="3"
            placeholder="العنوان بالتفصيل *"></textarea>

        <button
            class="whatsapp"
            onclick="sendWhatsApp()">

            📲 إرسال الطلب عبر واتساب

        </button>

    </div>

</div>

<script type="module">

/* ==========================================
   Firebase
========================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* ==========================================
   Firebase Config
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBoQHatPvFXnmCuI1M1UJcUWWQsB7vk3g0",

    authDomain:
        "pistach-d-alep.firebaseapp.com",

    projectId:
        "pistach-d-alep",

    storageBucket:
        "pistach-d-alep.firebasestorage.app",

    messagingSenderId:
        "288943885593",

    appId:
        "1:288943885593:web:4737041244be376c274988",

    measurementId:
        "G-569W2MXBTJ"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* ==========================================
   رقم واتساب الجديد
========================================== */

const whatsappNumber =
    "201010644644";


/* ==========================================
   المتغيرات
========================================== */

let products = [];

let cart = [];

let currentCategory = "الكل";


/* ==========================================
   تحميل المنتجات من Firebase
========================================== */

async function loadProducts(){

    const menu =
        document.getElementById("menu");

    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );


        products = [];


        snapshot.forEach(item => {

            const data =
                item.data();


            /*
             * إذا كان الصنف مخفيًا
             * لا يظهر للزبون
             */

            if(data.hidden === true){

                return;

            }


            /*
             * ترتيب الأوزان بشكل إجباري:
             *
             * 1 - كيلو
             * 2 - نصف كيلو
             * 3 - ربع كيلو
             *
             * حتى لو كانت Firebase
             * مخزنة بترتيب مختلف.
             */

            let weights =
                Array.isArray(data.weights)
                &&
                data.weights.length
                ?
                [...data.weights]
                :
                ["كيلو"];


            const orderedWeights = [];


            if(
                weights.includes("كيلو")
            ){

                orderedWeights.push("كيلو");

            }


            if(
                weights.includes("نصف كيلو")
            ){

                orderedWeights.push("نصف كيلو");

            }


            if(
                weights.includes("ربع كيلو")
            ){

                orderedWeights.push("ربع كيلو");

            }


            /*
             * إضافة أي وزن آخر موجود
             * بدون حذفه.
             */

            weights.forEach(weight => {

                if(
                    !orderedWeights.includes(weight)
                ){

                    orderedWeights.push(weight);

                }

            });


            weights =
                orderedWeights;


            products.push({

                id:item.id,

                name:
                    data.name || "",

                description:
                    data.description || "",

                price:
                    Number(data.price) || 0,

                category:
                    data.category || "أخرى",

                image:
                    data.image || "",

                maxQuantity:
                    Number(data.maxQuantity) > 0
                    ?
                    Number(data.maxQuantity)
                    :
                    10,

                weights:
                    weights

            });

        });


        showCategories();

        showProducts();


    }catch(error){

        console.error(error);


        menu.innerHTML = `

            <div class="empty">

                حدث خطأ أثناء تحميل المنيو

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


/* ==========================================
   التصنيفات
========================================== */

function showCategories(){

    const categories =
        document.getElementById("categories");


    const list = [

        "الكل",

        ...new Set(
            products.map(
                p => p.category
            )
        )

    ];


    categories.innerHTML = "";


    list.forEach(category => {

        const button =
            document.createElement("button");


        button.innerText =
            category;


        if(
            category ===
            currentCategory
        ){

            button.className =
                "active";

        }


        button.onclick = function(){

            selectCategory(category);

        };


        categories.appendChild(button);

    });

}


/* ==========================================
   اختيار التصنيف
========================================== */

function selectCategory(category){

    currentCategory =
        category;


    showCategories();

    showProducts();

}


/* ==========================================
   حساب سعر الوزن
========================================== */

function getWeightPrice(
    price,
    weight
){

    if(
        weight === "ربع كيلو"
    ){

        return price * 0.25;

    }


    if(
        weight === "نصف كيلو"
    ){

        return price * 0.5;

    }


    return price;

}


/* ==========================================
   عرض المنتجات
========================================== */

function showProducts(){

    const menu =
        document.getElementById("menu");


    menu.innerHTML = "";


    const list =
        currentCategory === "الكل"
        ?
        products
        :
        products.filter(
            p =>
            p.category ===
            currentCategory
        );


    if(list.length === 0){

        menu.innerHTML = `

            <div class="empty">

                لا توجد أصناف متاحة حاليًا

            </div>

        `;

        return;

    }


    list.forEach(product => {

        const div =
            document.createElement("div");


        div.className =
            "item";


        let weightOptions = "";


        /*
         * هنا أيضًا نضمن أن
         * الكيلو هو أول خيار.
         */

        product.weights.forEach(
            weight => {

                const weightPrice =
                    getWeightPrice(
                        product.price,
                        weight
                    );


                weightOptions += `

                    <option
                        value="${escapeHtml(weight)}">

                        ${escapeHtml(weight)}
                        -
                        ${weightPrice}
                        جنيه

                    </option>

                `;

            }
        );


        div.innerHTML = `

            ${
                product.image
                ?
                `
                <img
                    src="${escapeHtml(product.image)}"
                    alt="${escapeHtml(product.name)}"
                    onerror="this.style.display='none'">
                `
                :
                ""
            }


            <div class="item-content">

                <h3>
                    ${escapeHtml(product.name)}
                </h3>


                <div class="description">

                    ${escapeHtml(
                        product.description
                    )}

                </div>


                <div class="price">

                    سعر الكيلو:
                    ${product.price}
                    جنيه

                </div>


                <select
                    class="weight-select"
                    id="weight-${product.id}">

                    ${weightOptions}

                </select>


                <div class="max-info">

                    الحد الأقصى:
                    ${product.maxQuantity}
                    كمية

                </div>


                <button
                    class="add"
                    onclick="addToCart('${product.id}')">

                    ➕ إضافة للسلة

                </button>

            </div>

        `;


        menu.appendChild(div);

    });

}


/* ==========================================
   إضافة للسلة
========================================== */

window.addToCart =
function(id){

    const product =
        products.find(
            p => p.id === id
        );


    if(!product){

        return;

    }


    const weightSelect =
        document.getElementById(
            "weight-" + product.id
        );


    const weight =
        weightSelect
        ?
        weightSelect.value
        :
        "كيلو";


    const existing =
        cart.find(
            p =>
            p.id === id
            &&
            p.weight === weight
        );


    if(existing){

        if(
            existing.quantity >=
            product.maxQuantity
        ){

            alert(
                "لا يمكنك طلب أكثر من " +
                product.maxQuantity +
                " كمية من هذا الصنف."
            );

            return;

        }


        existing.quantity++;


    }else{

        cart.push({

            id:
                product.id,

            name:
                product.name,

            price:
                product.price,

            weight:
                weight,

            weightPrice:
                getWeightPrice(
                    product.price,
                    weight
                ),

            quantity:
                1,

            maxQuantity:
                product.maxQuantity

        });

    }


    updateCart();

};


/* ==========================================
   زيادة الكمية
========================================== */

window.increase =
function(index){

    const item =
        cart[index];


    if(!item){

        return;

    }


    if(
        item.quantity >=
        item.maxQuantity
    ){

        alert(
            "وصلت إلى الحد الأقصى لهذا الصنف."
        );

        return;

    }


    item.quantity++;


    updateCart();

};


/* ==========================================
   نقصان الكمية
========================================== */

window.decrease =
function(index){

    const item =
        cart[index];


    if(!item){

        return;

    }


    item.quantity--;


    if(
        item.quantity <= 0
    ){

        cart.splice(
            index,
            1
        );

    }


    updateCart();

};


/* ==========================================
   تحديث السلة
========================================== */

function updateCart(){

    const box =
        document.getElementById(
            "cartItems"
        );


    const totalElement =
        document.getElementById(
            "total"
        );


    if(cart.length === 0){

        box.innerHTML = `

            <div class="empty">

                السلة فارغة

            </div>

        `;


        totalElement.innerText =
            "0";


        return;

    }


    let total = 0;


    box.innerHTML = "";


    cart.forEach(
        (item,index) => {

            const itemTotal =
                item.weightPrice *
                item.quantity;


            total += itemTotal;


            box.innerHTML += `

                <div class="cart-item">

                    <div class="cart-top">

                        <strong>
                            ${escapeHtml(
                                item.name
                            )}
                        </strong>

                        <strong>
                            ${itemTotal}
                            جنيه
                        </strong>

                    </div>


                    <div class="cart-details">

                        الوزن:
                        ${escapeHtml(
                            item.weight
                        )}

                        <br>

                        سعر الوحدة:
                        ${item.weightPrice}
                        جنيه

                    </div>


                    <div class="qty">

                        <button
                            onclick="increase(${index})">

                            +

                        </button>


                        <span>

                            ${item.quantity}

                        </span>


                        <button
                            onclick="decrease(${index})">

                            -

                        </button>

                    </div>

                </div>

            `;

        }
    );


    totalElement.innerText =
        total;

}


/* ==========================================
   إرسال واتساب
========================================== */

window.sendWhatsApp =
function(){

    if(cart.length === 0){

        alert(
            "أضف صنفًا إلى السلة أولاً."
        );

        return;

    }


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    if(!name){

        alert(
            "اكتب اسم العميل."
        );

        document
        .getElementById("name")
        .focus();

        return;

    }


    if(!phone){

        alert(
            "اكتب رقم الهاتف."
        );

        document
        .getElementById("phone")
        .focus();

        return;

    }


    if(!address){

        alert(
            "اكتب العنوان بالتفصيل."
        );

        document
        .getElementById("address")
        .focus();

        return;

    }


    let total = 0;


    let message =
        "🛒 طلب جديد\n\n";


    message +=
        "👤 الاسم: "
        +
        name
        +
        "\n";


    message +=
        "📞 الهاتف: "
        +
        phone
        +
        "\n";


    message +=
        "📍 العنوان: "
        +
        address
        +
        "\n\n";


    message +=
        "📦 تفاصيل الطلب:\n";


    cart.forEach(item => {

        const itemTotal =
            item.weightPrice *
            item.quantity;


        total += itemTotal;


        message +=

            "• " +
            item.name +
            "\n" +

            "  الوزن: " +
            item.weight +
            "\n" +

            "  الكمية: " +
            item.quantity +
            "\n" +

            "  السعر: " +
            itemTotal +
            " جنيه\n\n";

    });


    message +=
        "💰 الإجمالي: "
        +
        total
        +
        " جنيه";


    const url =

        "https://wa.me/" +

        whatsappNumber +

        "?text=" +

        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

};


/* ==========================================
   حماية النصوص
========================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   تشغيل المنيو
========================================== */

loadProducts();

</script>

</body>
    </html>
