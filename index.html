<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل دخول المدير</title>
</head>
<body>

  <h2>تسجيل دخول المدير</h2>
  <input type="email" id="email" placeholder="البريد الإلكتروني"><br><br>
  <input type="password" id="password" placeholder="كلمة المرور"><br><br>
  <button id="loginBtn">دخول</button>

  <p id="message" style="color: red;"></p>

  <!-- كود الاتصال المباشر بـ Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // 1. انسخ بياناتك من Firebase Console وضغطها هنا
    const firebaseConfig = {
      apiKey: "ضع_مفتاح_الـ_API_الجديد_هنا",
      authDomain: "your-app.firebaseapp.com",
      projectId: "your-app-id",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef..."
    };

    // 2. تهيئة الاتصال
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 3. عند الضغط على زر الدخول
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("message");

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        msg.style.color = "green";
        msg.innerText = "تم تسجيل الدخول بنجاح! مرحباً " + userCredential.user.email;
      } catch (error) {
        msg.style.color = "red";
        msg.innerText = "خطأ: " + error.message;
      }
    });
  </script>

</body>
</html>
