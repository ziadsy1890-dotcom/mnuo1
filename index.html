<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منيو</title>

<style>
:root{
    --primary:#789262;
    --bg:#d9e8b8;
    --text:#222;
    --card:#fff;
    --soft:#f7f9ef
}

*{
    box-sizing:border-box
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text)
}

header{
    background:var(--primary);
    color:#fff;
    text-align:center;
    padding:18px 10px;
    position:relative
}

header img{
    max-width:110px;
    max-height:80px;
    object-fit:contain;
    display:none;
    margin:0 auto 8px;
    border-radius:10px
}

header h1{
    margin:0;
    font-size:28px
}

header p{
    margin:7px 0 0
}

.container{
    max-width:760px;
    margin:auto;
    padding:15px
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px
}

.categories button{
    border:0;
    background:var(--soft);
    padding:10px 16px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer
}

.categories button.active{
    background:var(--primary);
    color:#fff
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px
}

.item{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px #0002
}

.item img{
    width:100%;
    height:155px;
    object-fit:cover
}

.no-image{
    width:100%;
    height:155px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f1f1;
    font-size:50px
}

.item-content{
    padding:12px
}

.item h3{
    margin:0 0 6px
}

.description{
    color:#777;
    font-size:13px;
    min-height:32px
}

.price{
    font-size:16px;
    font-weight:bold;
    margin:8px 0
}

.price-main{
    color:var(--primary);
}

.price-extra{
    color:#777;
    font-size:13px;
    font-weight:normal;
    margin-top:4px;
    line-height:1.6;
}

.custom-price{
    color:var(--primary);
    font-weight:bold;
    margin:10px 0
}

.weight-select,
input,
textarea,
select{
    width:100%;
    padding:11px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-family:inherit;
    background:#fff
}

.add,
.whatsapp{
    width:100%;
    padding:11px;
    border:0;
    border-radius:8px;
    background:var(--primary);
    color:#fff;
    cursor:pointer
}

.add{
    margin-top:5px;
    font-weight:bold
}

.cart{
    background:#fff;
    margin-top:20px;
    padding:15px;
    border-radius:12px
}

.cart-item{
    border-bottom:1px solid #eee;
    padding:12px 0
}

.cart-top{
    display:flex;
    justify-content:space-between;
    gap:10px
}

.cart-details{
    color:#666;
    font-size:14px;
    margin-top:5px
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px
}

.qty button{
    width:32px;
    height:32px;
    border:0;
    border-radius:6px;
    cursor:pointer
}

.qty span{
    min-width:25px;
    text-align:center;
    font-weight:bold
}

.total{
    font-size:20px;
    font-weight:bold;
    margin:15px 0
}

.whatsapp{
    background:#25D366;
    font-size:17px;
    font-weight:bold
}

.empty,
.loading{
    text-align:center;
    color:#777;
    padding:20px
}

.floating-cart{
    position:fixed;
    bottom:18px;
    right:18px;
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    font-size:25px;
    box-shadow:0 4px 14px #0004;
    z-index:20;
    cursor:pointer
}

.cart-count{
    position:absolute;
    top:-5px;
    left:-5px;
    background:#c62828;
    color:#fff;
    border-radius:50%;
    min-width:24px;
    height:24px;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold
}

#cartSection{
    scroll-margin-top:15px
}

.delivery{
    background:#f7f7f7;
    padding:10px;
    border-radius:9px;
    margin:8px 0
}

.delivery label{
    display:block;
    font-size:14px;
    margin-bottom:4px
}

.delivery-fee{
    margin-top:7px;
    font-size:14px
}

@media(max-width:500px){

    .menu{
        grid-template-columns:1fr
    }

}
</style>
</head>

<body>

<header>

<img id="logo" alt="الشعار">

<h1 id="storeName">🍰 Pistach D'Alep</h1>

<p id="storeSubtitle">بيستاش دي ألب</p>

</header>

<div class="container">

<div class="categories" id="categories"></div>

<div class="menu" id="menu">
    <div class="loading">جاري تحميل المنيو...</div>
</div>

<section class="cart" id="cartSection">

<h2>🛒 سلة الطلب</h2>

<div id="cartItems">
    <div class="empty">السلة فارغة</div>
</div>

<div class="total">
    الإجمالي:
    <span id="subtotal">0</span>
    جنيه
</div>

<div class="delivery">

<label>🚚 منطقة التوصيل</label>

<select id="region">
    <option value="">اختر المنطقة</option>
</select>

<div class="delivery-fee">
    رسوم التوصيل:
    <strong>
        <span id="deliveryFee">0</span>
        جنيه
    </strong>
</div>

</div>

<div class="total">
    الإجمالي النهائي:
    <span id="grandTotal">0</span>
    جنيه
</div>

<input id="name" placeholder="اسم العميل *">

<input id="phone" type="tel" placeholder="رقم الهاتف *">

<textarea
    id="address"
    rows="3"
    placeholder="العنوان بالتفصيل *"
></textarea>

<button class="whatsapp" id="whatsappBtn">
    📲 إرسال الطلب عبر واتساب
</button>

</section>

</div>

<button
    class="floating-cart"
    id="floatingCart"
    aria-label="السلة"
>
    🛒
    <span class="cart-count" id="cartCount">0</span>
</button>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBoQHatPvFXnmCuI1M1UJcUWWQsB7vk3g0",

    authDomain:
    "pistach-d-alep.firebaseapp.com",

    projectId:
    "pistach-d-alep",

    storageBucket:
    "pistach-d-alep.firebasestorage.app",

    messagingSenderId:
    "288943885593",

    appId:
    "1:288943885593:web:4737041244be376c274988",

    measurementId:
    "G-569W2MXBTJ"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);


/* =========================
   إعدادات
========================= */

const whatsappNumber =
"201010644644";


let products = [];

let cart = [];

let regions = [];

let categories = [];

let currentCategory = "الكل";

let settings = {};


/* =========================
   اختصارات
========================= */

const $ =
id =>
document.getElementById(id);


const esc =
value =>
String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");


const num =
value =>
Number(value) || 0;


/* =========================
   تحميل البيانات
========================= */

async function loadAll(){

    try{

        const [
            ps,
            rs,
            cs,
            ss
        ] =
        await Promise.all([

            getDocs(
                collection(
                    db,
                    "products"
                )
            ),

            getDocs(
                collection(
                    db,
                    "deliveryRegions"
                )
            ),

            getDocs(
                collection(
                    db,
                    "categories"
                )
            ),

            getDoc(
                doc(
                    db,
                    "settings",
                    "main"
                )
            )

        ]);


        products =
        ps.docs
        .map(
            d => ({
                id:d.id,
                ...d.data()
            })
        )
        .filter(
            p =>
            p.hidden !== true
        );


        regions =
        rs.docs
        .map(
            d => ({
                id:d.id,
                ...d.data()
            })
        )
        .sort(
            (a,b) =>
            num(a.order || 999) -
            num(b.order || 999)
        );


        categories =
        cs.docs
        .map(
            d => ({
                id:d.id,
                ...d.data()
            })
        )
        .sort(
            (a,b) =>
            num(a.order || 999) -
            num(b.order || 999)
        );


        settings =
        ss.exists()
        ? ss.data()
        : {};


        applySettings();

        showCategories();

        showProducts();

        showRegions();

        updateCart();

    }

    catch(error){

        console.error(error);

        $("menu").innerHTML =
        `
        <div class="empty">
            حدث خطأ أثناء تحميل المنيو
            <br>
            ${esc(error.message)}
        </div>
        `;

    }

}


/* =========================
   إعدادات المتجر
========================= */

function applySettings(){

    document.documentElement.style.setProperty(
        "--primary",
        settings.primaryColor ||
        "#789262"
    );


    document.documentElement.style.setProperty(
        "--bg",
        settings.backgroundColor ||
        "#d9e8b8"
    );


    document.documentElement.style.setProperty(
        "--text",
        settings.textColor ||
        "#222"
    );


    $("storeName").textContent =
    settings.storeName ||
    "🍰 Pistach D'Alep";


    $("storeSubtitle").textContent =
    settings.subtitle ||
    "بيستاش دي ألب";


    document.title =
    settings.storeName ||
    "منيو";


    const logo =
    settings.logoUrl ||
    settings.logo ||
    "";


    if(logo){

        $("logo").src =
        logo;

        $("logo").style.display =
        "block";

    }

    else{

        $("logo").style.display =
        "none";

    }

}


/* =========================
   مناطق التوصيل
========================= */

function showRegions(){

    $("region").innerHTML =
    `
    <option value="">
        اختر المنطقة
    </option>
    ` +

    regions
    .map(
        r =>
        `
        <option value="${esc(r.id)}">
            ${esc(r.name)}
            -
            ${num(r.fee)}
            جنيه
        </option>
        `
    )
    .join("");

}


/* =========================
   الأقسام
========================= */

function showCategories(){

    let names = [];


    if(categories.length){

        names =
        categories
        .map(
            c => c.name
        )
        .filter(Boolean);

    }

    else{

        names =
        [
            ...new Set(
                products.map(
                    p =>
                    p.category ||
                    "أخرى"
                )
            )
        ];

    }


    const list = [

        "الكل",

        ...names.filter(
            x =>
            x &&
            x !== "الكل"
        )

    ];


    $("categories").innerHTML =

    list
    .map(
        category =>
        `
        <button
            type="button"
            class="${
                category === currentCategory
                ? "active"
                : ""
            }"
            data-category="${esc(category)}"
        >
            ${esc(category)}
        </button>
        `
    )
    .join("");


    document
    .querySelectorAll(
        "#categories button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    currentCategory =
                    button.dataset.category;

                    showCategories();

                    showProducts();

                }
            );

        }
    );

}


/* =========================
   تجهيز الأسعار
========================= */

function getOptions(product){

    let options = [];


    /*
       النظام الجديد:
       units
    */

    if(
        Array.isArray(product.units) &&
        product.units.length
    ){

        options =
        product.units
        .map(
            unit => ({

                name:
                String(
                    unit.name ?? ""
                ).trim(),

                price:
                num(unit.price)

            })
        )
        .filter(
            unit =>
            unit.name
        );

    }


    /*
       النظام القديم:
       prices
    */

    else if(
        product.prices &&
        typeof product.prices ===
        "object"
    ){

        options =
        Object.entries(
            product.prices
        )
        .map(
            ([name,price]) => ({

                name:
                String(name).trim(),

                price:
                num(price)

            })
        )
        .filter(
            unit =>
            unit.name
        );

    }


    /*
       النظام القديم جدًا
    */

    else if(
        num(product.price) > 0
    ){

        const base =
        num(product.price);


        const weights =
        Array.isArray(product.weights)
        ?
        product.weights
        :
        ["كيلو"];


        options =
        weights.map(
            weight => ({

                name:
                weight,

                price:

                weight ===
                "ربع كيلو"

                ?

                base * 0.25

                :

                weight ===
                "نصف كيلو"

                ?

                base * 0.5

                :

                base

            })
        );

    }


    return options;

}


/* =========================
   نوع التسعير
========================= */

function getPricingType(product, options){

    if(product.pricingType){

        return product.pricingType;

    }


    /*
       دعم المنتجات القديمة
    */

    const hasKilo =
    options.some(
        option =>
        option.name === "كيلو" ||
        option.name === "نصف كيلو" ||
        option.name === "ربع كيلو"
    );


    if(hasKilo){

        return "kilo";

    }


    return "single";

}


/* =========================
   ترتيب خيارات الأسعار
========================= */

function sortOptions(product, options){

    const type =
    getPricingType(
        product,
        options
    );


    /*
       الكيلو له ترتيب ثابت
    */

    if(type === "kilo"){

        const order = {

            "كيلو":1,

            "نصف كيلو":2,

            "ربع كيلو":3

        };


        return [
            ...options
        ].sort(
            (a,b) => {

                const aOrder =
                order[a.name] || 99;

                const bOrder =
                order[b.name] || 99;


                if(
                    aOrder !==
                    bOrder
                ){

                    return (
                        aOrder -
                        bOrder
                    );

                }


                return (
                    b.price -
                    a.price
                );

            }
        );

    }


    /*
       القطعة والعلبة:
       نترك الخيار الأساسي
       أولًا.
    */

    if(
        type === "piece" ||
        type === "box"
    ){

        return options;

    }


    /*
       أي نظام متعدد قديم:
       الأعلى سعرًا أولًا
    */

    return [
        ...options
    ].sort(
        (a,b) =>
        b.price -
        a.price
    );

}


/* =========================
   السعر الظاهر على البطاقة
========================= */

function getMainPrice(product, options){

    const type =
    getPricingType(
        product,
        options
    );


    if(type === "custom"){

        return null;

    }


    if(type === "kilo"){

        const kilo =
        options.find(
            option =>
            option.name ===
            "كيلو" &&
            option.price > 0
        );


        if(kilo){

            return kilo;

        }

    }


    if(
        type === "piece" ||
        type === "box"
    ){

        return (
            options.find(
                option =>
                option.price > 0
            )
            ||
            null
        );

    }


    return (
        options.find(
            option =>
            option.price > 0
        )
        ||
        null
    );

}


/* =========================
   عرض الصنف
========================= */

function showProducts(){

    let list;


    if(
        currentCategory ===
        "الكل"
    ){

        list =
        products;

    }

    else{

        /*
           يدعم category كـ ID
           أو كاسم
        */

        const selected =
        categories.find(
            c =>
            c.name ===
            currentCategory
        );


        list =
        products.filter(
            product => {

                if(
                    selected &&
                    product.category ===
                    selected.id
                ){

                    return true;

                }


                return (
                    product.category ||
                    "أخرى"
                ) ===
                currentCategory;

            }
        );

    }


    /*
       ترتيب الأصناف
    */

    list =
    [...list]
    .sort(
        (a,b) =>
        num(a.order || 999) -
        num(b.order || 999)
    );


    if(!list.length){

        $("menu").innerHTML =
        `
        <div class="empty">
            لا توجد أصناف متاحة حاليًا
        </div>
        `;

        return;

    }


    $("menu").innerHTML =

    list
    .map(
        product => {

            const options =
            sortOptions(
                product,
                getOptions(product)
            );


            const type =
            getPricingType(
                product,
                options
            );


            const mainPrice =
            getMainPrice(
                product,
                options
            );


            let imageHtml;


            if(product.image){

                imageHtml =
                `
                <img
                    src="${esc(product.image)}"
                    alt="${esc(product.name)}"
                    onerror="this.style.display='none'"
                >
                `;

            }

            else{

                imageHtml =
                `
                <div class="no-image">
                    🥜
                </div>
                `;

            }


            /*
               نص السعر
            */

            let priceHtml = "";


            if(type === "custom"){

                priceHtml =
                `
                <div class="custom-price">
                    📝 السعر حسب الطلب
                </div>
                `;

            }

            else if(mainPrice){

                priceHtml =
                `
                <div class="price">
                    <div class="price-main">
                        ${esc(mainPrice.name)}
                        :
                        ${num(mainPrice.price)}
                        جنيه
                    </div>
                `;


                /*
                   إظهار نصف وربع كيلو
                   على البطاقة
                */

                if(type === "kilo"){

                    const extra =
                    options.filter(
                        option =>
                        option.name !==
                        "كيلو"
                    );


                    if(extra.length){

                        priceHtml +=
                        `
                        <div class="price-extra">
                            ${
                                extra
                                .map(
                                    option =>
                                    `
                                    ${esc(option.name)}
                                    :
                                    ${num(option.price)}
                                    جنيه
