<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>فستق حلب</title>

<style>

:root{
    --primary:#789262;
    --bg:#d9e8b8;
    --text:#222;
    --card:#fff;
    --soft:#f7f9ef;
    --border:#e5e5e5;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea,
select{
    font-family:inherit;
}

header{
    background:var(--primary);
    color:#fff;
    text-align:center;
    padding:20px 12px;
    box-shadow:0 2px 8px #0002;
}

header img{
    max-width:130px;
    max-height:90px;
    object-fit:contain;
    display:none;
    margin:0 auto 10px;
    border-radius:12px;
}

header h1{
    margin:0;
    font-size:29px;
}

header p{
    margin:8px 0 0;
    font-size:15px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

/* الأقسام */

.categories-wrapper{
    position:sticky;
    top:0;
    z-index:10;
    background:var(--bg);
    padding:8px 0;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.categories button{
    border:0;
    background:var(--soft);
    color:var(--text);
    padding:10px 17px;
    border-radius:22px;
    white-space:nowrap;
    cursor:pointer;
    font-size:14px;
    transition:.2s;
}

.categories button.active{
    background:var(--primary);
    color:#fff;
}

/* المنيو */

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.item{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px #0002;
}

.item-image{
    width:100%;
    height:180px;
    object-fit:cover;
    display:block;
}

.item-content{
    padding:13px;
}

.item h3{
    margin:0 0 7px;
    font-size:19px;
}

.description{
    color:#777;
    font-size:13px;
    line-height:1.6;
    min-height:35px;
}

.price-box{
    background:#f6f8f1;
    border-radius:9px;
    padding:8px 10px;
    margin:10px 0;
}

.price-line{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:4px 0;
    border-bottom:1px solid #ddd;
    font-size:14px;
}

.price-line:last-child{
    border-bottom:0;
}

.price-line strong{
    color:var(--primary);
}

.unit-select{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#fff;
    margin:5px 0;
    font-size:14px;
}

.add-button{
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:var(--primary);
    color:#fff;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.add-button:active{
    transform:scale(.98);
}

/* السلة */

.cart{
    background:#fff;
    margin-top:22px;
    padding:17px;
    border-radius:14px;
    box-shadow:0 2px 10px #0001;
}

.cart h2{
    margin:0 0 15px;
}

.cart-item{
    border-bottom:1px solid #eee;
    padding:13px 0;
}

.cart-item:last-child{
    border-bottom:0;
}

.cart-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.cart-name{
    font-weight:bold;
}

.cart-total-item{
    font-weight:bold;
    white-space:nowrap;
}

.cart-details{
    color:#666;
    font-size:13px;
    margin-top:5px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:10px;
}

.qty button{
    width:34px;
    height:34px;
    padding:0;
    border:0;
    border-radius:7px;
    cursor:pointer;
    background:#eee;
    color:#222;
    font-size:18px;
}

.qty button.delete{
    background:#f8d7da;
    color:#842029;
}

.qty span{
    min-width:28px;
    text-align:center;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px 10px;
}

.loading{
    text-align:center;
    color:#777;
    padding:35px 10px;
}

/* الإجمالي */

.total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    font-weight:bold;
    margin:15px 0;
}

.final-total{
    font-size:22px;
    color:var(--primary);
}

/* التوصيل */

.delivery{
    background:#f7f7f7;
    padding:12px;
    border-radius:10px;
    margin:12px 0;
}

.delivery label{
    display:block;
    font-size:14px;
    margin-bottom:6px;
    font-weight:bold;
}

.delivery select{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
}

/* بيانات العميل */

.customer input,
.customer textarea{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    background:#fff;
}

.customer textarea{
    min-height:90px;
    resize:vertical;
}

/* واتساب */

.whatsapp{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#25D366;
    color:#fff;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    margin-top:8px;
}

/* السوشيال */

.social{
    text-align:center;
    padding:25px 10px 90px;
}

.social h3{
    margin-bottom:15px;
}

.social-links{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.social-links a{
    text-decoration:none;
    color:#fff;
    background:var(--primary);
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
}

/* زر السلة */

.floating-cart{
    position:fixed;
    bottom:18px;
    right:18px;
    width:60px;
    height:60px;
    border:0;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    font-size:25px;
    box-shadow:0 4px 14px #0004;
    z-index:30;
    cursor:pointer;
}

.cart-count{
    position:absolute;
    top:-5px;
    left:-5px;
    background:#c62828;
    color:#fff;
    border-radius:50%;
    min-width:24px;
    height:24px;
    padding:0 5px;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* رسالة */

.notice{
    background:#fff3cd;
    color:#664d03;
    padding:12px;
    border-radius:9px;
    margin:10px 0;
    text-align:center;
    display:none;
}

/* موبايل */

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .menu{
        grid-template-columns:1fr;
        gap:13px;
    }

    .item-image{
        height:200px;
    }

    header h1{
        font-size:25px;
    }

}

</style>

</head>
